<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Receiver</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #141418;
      --panel-2: #1a1a1f;
      --panel-3: #212127;
      --line: #2a2a31;
      --line-2: #34343d;
      --text: #ececef;
      --dim: #88888f;
      --faint: #4e4e57;
      --accent: #e6543a;
      --accent-dk: #b83a24;
      --green: #4a9d68;
      --amber: #d99a2b;
      --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --eo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 0%, rgba(230, 84, 58, 0.05), transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(80, 120, 200, 0.04), transparent 40%),
        radial-gradient(circle, rgba(255, 255, 255, 0.018) 1px, transparent 1.2px);
      background-size: auto, auto, 22px 22px;
      font-family: var(--sans);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ PANEL ============ */
    .radio {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: var(--panel);
      border-radius: 10px;
      border: 1px solid var(--line);
      border-top-color: #3a3a44;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.7),
        0 2px 0 rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      overflow: hidden;
      animation: panel-in 0.5s var(--eo) both;
    }

    @keyframes panel-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* corner screws */
    .screw {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a4a54, #1e1e24 70%);
      box-shadow: inset 0 0 0 1px #0a0a0c, 0 1px 0 rgba(255, 255, 255, 0.05);
      pointer-events: none;
      z-index: 5;
    }

    .screw.tl {
      top: 8px;
      left: 8px;
    }

    .screw.tr {
      top: 8px;
      right: 8px;
    }

    .screw.bl {
      bottom: 8px;
      left: 8px;
    }

    .screw.br {
      bottom: 8px;
      right: 8px;
    }

    /* ============ LABELS ============ */
    .lbl {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 2.2px;
      color: var(--faint);
      text-transform: uppercase;
      user-select: none;
    }

    /* ============ FREQUENCY STRIP ============ */
    .freq-strip {
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 40%),
        var(--panel);
    }

    .freq-display {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .freq-value {
      font-family: var(--mono);
      font-size: 74px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -3.5px;
      line-height: 0.9;
      color: var(--text);
      text-shadow:
        0 0 24px rgba(230, 84, 58, 0.12),
        0 1px 2px rgba(0, 0, 0, 0.6);
      transition: color 0.35s ease, text-shadow 0.35s ease;
    }

    .freq-value.tune {
      color: var(--accent);
      text-shadow: 0 0 30px rgba(230, 84, 58, 0.5), 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .freq-unit {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: var(--dim);
      padding-bottom: 6px;
    }

    .indicators {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding-bottom: 6px;
    }

    .ind {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.35;
      transition: opacity 0.3s;
    }

    .ind.on {
      opacity: 1;
    }

    .ind .lbl {
      font-size: 7px;
      letter-spacing: 1.5px;
    }

    /* signal bars */
    .bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 13px;
    }

    .bars i {
      display: block;
      width: 2.5px;
      background: var(--faint);
      border-radius: 0.5px;
      transition: background 0.25s, height 0.25s;
    }

    .bars i:nth-child(1) {
      height: 4px;
    }

    .bars i:nth-child(2) {
      height: 7px;
    }

    .bars i:nth-child(3) {
      height: 10px;
    }

    .bars i:nth-child(4) {
      height: 13px;
    }

    .ind.on .bars i {
      background: var(--accent);
    }

    .ind.on .bars i:nth-child(4) {
      background: var(--green);
    }

    /* stereo dot */
    .stdot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--faint);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .ind.on .stdot {
      background: var(--accent);
      box-shadow: 0 0 7px rgba(230, 84, 58, 0.6);
    }

    /* sleep dot */
    .slpdot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--faint);
      transition: background 0.25s, box-shadow 0.25s;
    }

    .ind.on .slpdot {
      background: var(--amber);
      box-shadow: 0 0 7px rgba(217, 154, 43, 0.6);
      animation: slp 2.5s ease-in-out infinite;
    }

    @keyframes slp {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* ============ STATION STRIP ============ */
    .station-strip {
      padding: 12px 22px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 68px;
      justify-content: center;
      background: var(--panel);
    }

    .station-name {
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-name.swap {
      animation: swap 0.3s var(--eo);
    }

    @keyframes swap {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .station-meta {
      font-size: 12px;
      color: var(--dim);
      font-family: var(--mono);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 16px;
    }

    .station-meta .sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
    }

    .station-meta .flag {
      font-size: 12px;
    }

    /* ============ DIAL ZONE ============ */
    .dial-zone {
      padding: 16px 22px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #08080a, #0c0c10);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dial-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dial-count {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--faint);
      letter-spacing: 1.2px;
    }

    .dial-wrap {
      position: relative;
      height: 96px;
      background: linear-gradient(180deg, #050507 0%, #0a0a0e 100%);
      border-radius: 5px;
      border: 1px solid #1a1a20;
      border-top-color: #050507;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: ew-resize;
      box-shadow:
        inset 0 3px 14px rgba(0, 0, 0, 0.9),
        inset 0 -1px 0 rgba(255, 255, 255, 0.03);
    }

    .dial-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg,
          rgba(10, 10, 12, 0.95) 0%, transparent 6%,
          transparent 94%, rgba(10, 10, 12, 0.95) 100%);
      z-index: 4;
    }

    /* scanline texture */
    .dial-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg,
          rgba(255, 255, 255, 0.012) 0 1px,
          transparent 1px 3px);
      z-index: 1;
    }

    .dial {
      overflow: hidden;
      height: 100%;
      position: relative;
    }

    .ticks {
      position: absolute;
      top: 0;
      height: 100%;
      will-change: transform;
    }

    .tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: #23232b;
      transition: background 0.2s;
    }

    .tick.maj {
      background: #45454f;
      width: 2px;
    }

    .tick-label {
      position: absolute;
      top: 8px;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }

    .dial-wrap:active .tick.maj {
      background: #5a5a68;
    }

    .dial-wrap:active .tick-label {
      color: var(--dim);
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      margin-left: -1px;
      background: linear-gradient(180deg, transparent, var(--accent) 12%, var(--accent) 88%, transparent);
      box-shadow: 0 0 12px rgba(230, 84, 58, 0.55), 0 0 3px var(--accent);
      z-index: 3;
    }

    .needle::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      background: var(--accent);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(230, 84, 58, 0.7);
    }

    .station-dot {
      position: absolute;
      bottom: 5px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--faint);
      transform: translateX(-50%);
      opacity: 0.5;
      z-index: 2;
      transition: opacity 0.25s, background 0.25s, transform 0.25s, box-shadow 0.25s;
    }

    .station-dot.near {
      background: var(--accent);
      opacity: 1;
      transform: translateX(-50%) scale(1.6);
      box-shadow: 0 0 6px rgba(230, 84, 58, 0.7);
    }

    /* ============ TRANSPORT ============ */
    .transport-zone {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: var(--panel);
    }

    .btn {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-top-color: var(--line-2);
      border-radius: 6px;
      color: var(--dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
      user-select: none;
      position: relative;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .btn:hover {
      background: var(--panel-3);
      border-color: var(--line-2);
      color: var(--text);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn.icon {
      width: 42px;
      height: 42px;
    }

    .btn.play {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      background: linear-gradient(180deg, #e6543a, #c9432b);
      border-color: var(--accent-dk);
      border-top-color: #f0664d;
      color: #fff;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.2) inset,
        0 2px 10px rgba(230, 84, 58, 0.35),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .btn.play:hover {
      background: linear-gradient(180deg, #ef5e44, #d04a30);
      color: #fff;
    }

    .btn.play svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      stroke: none;
    }

    /* ============ CONTROL STRIP (vol + region) ============ */
    .ctrl-strip {
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 18px;
      align-items: center;
      background: var(--panel);
    }

    @media (max-width: 520px) {
      .ctrl-strip {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .ctrl-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .ctrl-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vol-row svg {
      width: 14px;
      height: 14px;
      stroke: var(--dim);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
      transition: stroke 0.2s;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: var(--line);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: var(--text);
      box-shadow: 0 0 0 2px var(--panel), 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: background 0.15s, transform 0.15s var(--eo);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--accent);
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: var(--text);
      border: none;
    }

    .vol-val {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      min-width: 30px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .sel-wrap {
      position: relative;
    }

    .sel-wrap svg {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      stroke: var(--faint);
      fill: none;
      stroke-width: 2.2;
      pointer-events: none;
    }

    select {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 26px 8px 10px;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text);
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-overflow: ellipsis;
    }

    select:hover {
      background: var(--panel-3);
      border-color: var(--line-2);
    }

    select:focus {
      border-color: var(--accent-dk);
    }

    select option {
      background: var(--panel-3);
      color: var(--text);
    }

    /* ============ UTILITY STRIP ============ */
    .util-strip {
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
      flex-wrap: wrap;
    }

    .utility-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .btn-sm {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.4px;
      padding: 7px 11px;
      cursor: pointer;
      transition: all 0.15s var(--eo);
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .btn-sm svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-sm:hover {
      background: var(--panel-2);
      border-color: var(--line-2);
      color: var(--text);
    }

    .btn-sm:active {
      transform: translateY(1px);
    }

    .btn-sm.active {
      border-color: var(--accent-dk);
      color: var(--accent);
      background: rgba(230, 84, 58, 0.07);
    }

    .btn-sm.active svg {
      animation: spin 2.5s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* status area */
    .status-area {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1.2px;
      color: var(--faint);
      min-width: 0;
      flex: 1 1 100%;
      justify-content: flex-end;
      text-transform: uppercase;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @media (min-width: 480px) {
      .status-area {
        flex: 0 1 auto;
      }
    }

    .status-area .sd {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-area.live .sd {
      background: var(--green);
      box-shadow: 0 0 7px rgba(74, 157, 104, 0.7);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-area.warn .sd {
      background: var(--amber);
      box-shadow: 0 0 7px rgba(217, 154, 43, 0.6);
    }

    .status-area.err {
      color: var(--accent);
    }

    .status-area.err .sd {
      background: var(--accent);
      box-shadow: 0 0 7px rgba(230, 84, 58, 0.6);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    #statusText {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ============ FAV SHEET ============ */
    .fav-sheet {
      border-top: 1px solid var(--line);
      background: var(--panel-2);
      max-height: 260px;
      overflow-y: auto;
      animation: sheet-down 0.25s var(--eo);
    }

    @keyframes sheet-down {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 22px 8px;
      border-bottom: 1px solid var(--line);
    }

    .fav-header .lbl {
      color: var(--dim);
    }

    .fav-close {
      background: none;
      border: none;
      color: var(--faint);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      line-height: 1;
      transition: color 0.15s;
    }

    .fav-close:hover {
      color: var(--accent);
    }

    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 22px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background 0.12s;
    }

    .fav-item:hover {
      background: var(--panel-3);
    }

    .fav-item .info {
      flex: 1;
      min-width: 0;
    }

    .fav-item .name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-item .detail {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--faint);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.4px;
    }

    .fav-item .remove {
      background: none;
      border: none;
      color: var(--faint);
      cursor: pointer;
      padding: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .fav-item .remove svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
    }

    .fav-item .remove:hover {
      color: var(--accent);
    }

    .empty-msg {
      padding: 24px 22px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* ============ DATA ROW (collapsed) ============ */
    .data-row {
      padding: 8px 22px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }

    .data-row svg {
      width: 12px;
      height: 12px;
      stroke: var(--faint);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .data-row input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--faint);
      padding: 4px 0;
      letter-spacing: 0.3px;
    }

    .data-row input::placeholder {
      color: #38383f;
    }

    .data-row button {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.2px;
      padding: 5px 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }

    .data-row button:hover {
      color: var(--text);
      border-color: var(--line-2);
    }

    .hidden {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 520px) {
      .freq-strip {
        padding: 14px 16px 10px;
      }

      .freq-value {
        font-size: 56px;
        letter-spacing: -2.5px;
      }

      .freq-unit {
        font-size: 12px;
        padding-bottom: 4px;
      }

      .station-strip {
        padding: 10px 16px 12px;
      }

      .station-name {
        font-size: 16px;
      }

      .dial-zone {
        padding: 12px 16px 14px;
      }

      .dial-wrap {
        height: 84px;
      }

      .transport-zone {
        padding: 12px 16px;
        gap: 10px;
      }

      .btn.icon {
        width: 38px;
        height: 38px;
      }

      .btn.play {
        width: 48px;
        height: 48px;
      }

      .ctrl-strip {
        padding: 12px 16px;
      }

      .util-strip {
        padding: 10px 16px;
      }

      .data-row {
        padding: 6px 16px 10px;
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--line-2);
    }

    /* ============ EDITOR ============ */
    .editor-overlay {
      position: fixed;
      top: 18px;
      left: 18px;
      width: 700px;
      height: 500px;
      max-width: calc(100vw - 36px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      gap: 6px;
      padding: 8px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      align-items: center;
    }

    .editor-header button {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .editor-header button:hover {
      background: var(--panel-3);
      color: var(--text);
    }

    .editor-header .drag-handle {
      cursor: grab;
    }

    .editor-tabs {
      display: flex;
      gap: 3px;
      overflow-x: auto;
    }

    .editor-tabs button.active {
      color: var(--accent);
      border-color: var(--accent-dk);
    }

    .editor-body {
      flex: 1;
      overflow: hidden;
    }

    .editor-body textarea {
      width: 100%;
      height: 100%;
      background: #050507;
      color: #c8c8d4;
      border: none;
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
      white-space: pre;
    }
  </style>
</head>

<body>

  <div class="radio" id="radioUI">
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <!-- ── FREQUENCY ─────────────────────────── -->
    <div class="freq-strip">
      <div>
        <div class="lbl" style="margin-bottom:5px;">Band&nbsp;/&nbsp;MHz</div>
        <div class="freq-display">
          <span class="freq-value" id="freqDisplay">98.8</span>
          <span class="freq-unit">MHz</span>
        </div>
      </div>
      <div class="indicators">
        <div class="ind" id="indSignal" title="Signal">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <span class="lbl">Sig</span>

        <div class="ind" id="indStereo" title="Stereo">
          <span class="stdot"></span>
          <span class="lbl">St</span>
        </div>
        <div class="ind" id="indSleep" title="Sleep timer">
          <span class="slpdot"></span>
          <span class="lbl">Slp</span>

    <!-- ── STATION ───────────────────────────── -->
    <div class="station-strip">

    <!-- ── DIAL ──────────────────────────────── -->

      </div>
      <div class="dial-wrap" id="dialWrap">
        <div class="dial" id="dialEl">

    <!-- ── TRANSPORT ─────────────────────────── -->
    <div class="transport-zone">
      <button class="btn icon" id="prevBtn" title="Previous station" aria-label="Previous">
      <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
    </button>
      <button class="btn play" id="playBtn" title="Play / pause" aria-label="Play">
      <svg viewBox="0 0 24 24" id="playIcon"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></svg>
    </button>
      <button class="btn icon" id="nextBtn" title="Next station" aria-label="Next">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
    </div>

    <!-- ── VOL + REGION ──────────────────────── -->
    <div class="ctrl-strip">
      <div class="ctrl-col">
        <div class="ctrl-head">
          <span class="lbl">Output</span>

        <div class="vol-row">
          <svg viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />

          <input type="range" id="volSlider" min="0" max="100" value="80" aria-label="Volume">

        <div class="sel-wrap">

            <polyline points="6 9 12 15 18 9" />

        </div>

    </div>

    <!-- ── UTILITY + STATUS ──────────────────── -->
    <div class="util-strip">
      <div class="utility-row">
        <button class="btn-sm" id="scanBtn" title="Scan band">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Scan
      </button>
        <button class="btn-sm" id="sleepBtn" title="Sleep timer">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        Sleep
      </button>
        <button class="btn-sm" id="favBtn" title="Favorites">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Favs
      </button>
        <button class="btn-sm" id="shareBtn" title="Share">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Share
      </button>
      </div>
      <div class="status-area" id="statusArea">
        <span class="sd"></span>
        <span id="statusText">standby</span>
      </div>
    </div>

    <!-- ── FAVORITES SHEET ───────────────────── -->
    <div class="fav-sheet hidden" id="favSheet">
      <div class="fav-header">
        <span class="lbl">Saved / <span id="favCount">0</span></span>
        <button class="fav-close" id="favClose" aria-label="Close">✕</button>
      </div>
      <div id="favList"></div>
    </div>

    <!-- ── DATA SOURCE ───────────────────────── -->
    <div class="data-row">
      <svg viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="9" ry="3" />
        <path d="M3 5v14a9 3 0 0 0 18 0V5" />
        <path d="M3 12a9 3 0 0 0 18 0" />
      </svg>
      <input type="text" id="dataUrlInput" placeholder="source url · leave blank to auto" spellcheck="false" autocomplete="off">
      <button id="loadDataBtn">Load</button>
      <button id="resetDataBtn">Reset</button>
    </div>

    <!-- engine-compat hidden elements -->
    <div style="display:none;" aria-hidden="true">
      <span id="tagEl"></span><span id="loadEl"></span><span id="stereoTag"></span>
      <span id="pwrLed"></span><span id="vuNeedle"></span><img id="logoImg" alt="">
      <button id="lcdFav"></button><span id="tunedMarkerEl"></span>
    </div>
  </div>

  <audio id="audioEl" preload="none"></audio>
  <div id="editorOverlay" class="editor-overlay hidden"></div>

  <script>
    (function(){
  "use strict";

  // ============================================================
  // CONSTANTS
  // ============================================================
  const RB_MIRRORS = [
    "https://de1.api.radio-browser.info",
    "https://de2.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://at1.api.radio-browser.info",
  ];
  const PERCHANCE_BASE = "https://perchance.org/7uttf51lxd/src/data";
  const LOCAL_BASE = "src/data";
  const CACHE_KEY = "rb_cache_v2";
  const CACHE_TTL = 24 * 60 * 60 * 1000;
  const CACHE_MAX = 4000;

  const PX = 52, LO = 87.5, HI = 108;

  // ============================================================
  // STATE
  // ============================================================
  let ALL = [];
  let DIAL = [];
  let seenUrls = new Set();
  let dialIdx = -1;
  let freq = 98.8;
  let favs = new Set(), fmeta = {};
  let current = null, hls = null;
  let wantPlaying = false, playGen = 0, failCount = 0;
  let scanTimer = null, sleepTimer = null, sleepMin = 0;
  let lastVol = 0.8;
  let dataSource = "";
  let tuneDebounce = null;

  try { favs = new Set(JSON.parse(localStorage.getItem("rv_favs") || "[]")); } catch(e){}
  try { fmeta = JSON.parse(localStorage.getItem("rv_fmeta") || "{}"); } catch(e){}

  const $ = id => document.getElementById(id);
  const freqDisplay = $("freqDisplay");
  const stationDisplay = $("stationDisplay");
  const metaFlag = $("metaFlag");
  const metaText = $("metaText");
  const dialWrap = $("dialWrap"), dialEl = $("dialEl"), ticksEl = $("ticksEl");
  const dialCount = $("dialCount");
  const countrySel = $("countrySel"), stationCount = $("stationCount");
  const playBtn = $("playBtn"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");
  const volSlider = $("volSlider"), volPct = $("volPct");
  const scanBtn = $("scanBtn"), sleepBtn = $("sleepBtn"), favBtn = $("favBtn"), shareBtn = $("shareBtn");
  const favSheet = $("favSheet"), favList = $("favList"), favClose = $("favClose"), favCount = $("favCount");
  const audioEl = $("audioEl");
  const statusArea = $("statusArea"), statusText = $("statusText");
  const indSignal = $("indSignal"), indStereo = $("indStereo"), indSleep = $("indSleep");
  const dataUrlInput = $("dataUrlInput");
  const loadDataBtn = $("loadDataBtn"), resetDataBtn = $("resetDataBtn");
  const playIcon = $("playIcon");

  // ============================================================
  // ICONS
  // ============================================================
  const ICON_PLAY    = '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>';
  const ICON_PAUSE   = '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>';
  const ICON_LOADING = '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="14 42" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/></circle>';

  function setPlayIcon(name) {
    if (!playIcon) return;
    const paths = { play: ICON_PLAY, pause: ICON_PAUSE, loading: ICON_LOADING }[name] || ICON_PLAY;
    playIcon.outerHTML = '<svg viewBox="0 0 24 24" id="playIcon">' + paths + '</svg>';
  }

  // ============================================================
  // STATUS
  // ============================================================
  function setStatus(msg, kind) {
    statusText.textContent = msg;
    statusArea.className = "status-area" + (kind ? " " + kind : "");
  }

  // ============================================================
  // MISC HELPERS
  // ============================================================
  function buzz() { try { navigator.vibrate && navigator.vibrate(5); } catch(e){} }

  function flag(cc) {
    if (!cc || cc.length !== 2 || cc === "ZZ") return "";
    let s = "";
    for (const ch of cc.toUpperCase()) s += String.fromCodePoint(127397 + ch.charCodeAt(0));
    return s;
  }

  function normUrl(u) {
    try {
      const q = u.indexOf("?");
      if (q < 0) return u.split("#")[0].toLowerCase();
      const base = u.slice(0, q).toLowerCase();
      const qs = u.slice(q + 1).split("#")[0];
      const skip = /^(t302|uuid|ref|sabc|skey|amsparams|playerid|dist|sid|kombi|playsessionid|_art)$/i;
      const keep = qs.split("&").filter(p => p && !skip.test(p.split("=")[0]));
      keep.sort();
      return base + (keep.length ? "?" + keep.join("&") : "");
    } catch(e) { return String(u).toLowerCase(); }
  }

  function addStations(list) {
    let added = 0;
    for (const s of list) {
      if (!s || !s.u) continue;
      const key = normUrl(s.u);
      if (seenUrls.has(key)) continue;
      seenUrls.add(key);
      ALL.push(s);
      added++;
    }
    return added;
  }

  function fmtOf(s) {
    const u = (s.u || "").split("?")[0].toLowerCase();
    if (u.endsWith(".m3u8")) return "hls";
    if (u.endsWith(".pls")) return "pls";
    if (u.endsWith(".m3u")) return "m3u";
    return "stream";
  }

  function xPos(f) { return (f - LO) * PX; }

  // ============================================================
  // DIAL
  // ============================================================
  function buildTicks() {
    ticksEl.innerHTML = "";
    ticksEl.style.width = xPos(HI) + "px";
    for (let f = LO; f <= HI + 1e-6; f = Math.round((f + 0.1) * 10) / 10) {
      const isMaj = Math.abs(f - Math.round(f)) < 1e-6;
      const t = document.createElement("div");
      t.className = "tick" + (isMaj ? " maj" : "");
      t.style.left = xPos(f) + "px";
      t.style.height = isMaj ? "30px" : "11px";
      ticksEl.appendChild(t);
      if (isMaj && f >= 88 && f <= 108 && Math.round(f) % 2 === 0) {
        const l = document.createElement("div");
        l.className = "tick-label";
        l.style.left = xPos(f) + "px";
        l.textContent = Math.round(f);
        ticksEl.appendChild(l);
      }
    }
  }

  function updateStationDots() {
    ticksEl.querySelectorAll(".station-dot").forEach(el => el.remove());
    const frag = document.createDocumentFragment();
    for (const s of DIAL) {
      const d = document.createElement("div");
      d.className = "station-dot";
      d.style.left = xPos(s._fm) + "px";
      d.dataset.fm = s._fm;
      frag.appendChild(d);
    }
    ticksEl.appendChild(frag);
  }

  function highlightStationDot() {
    ticksEl.querySelectorAll(".station-dot").forEach(d => {
      const f = parseFloat(d.dataset.fm);
      d.classList.toggle("near", Math.abs(f - freq) < 0.6);
    });
  }

  function nearestIdx(f) {
    if (!DIAL.length) return -1;
    let b = 0, bd = 1e9;
    for (let i = 0; i < DIAL.length; i++) {
      const d = Math.abs(DIAL[i]._fm - f);
      if (d < bd) { bd = d; b = i; }
    }
    return b;
  }

  // ============================================================
  // PAINT
  // ============================================================
  function paint(animateFreq) {
    if (animateFreq) {
      freqDisplay.classList.remove("tune");
      void freqDisplay.offsetWidth;
      freqDisplay.classList.add("tune");
      clearTimeout(tuneDebounce);
      tuneDebounce = setTimeout(() => freqDisplay.classList.remove("tune"), 220);
    }
    freqDisplay.textContent = freq.toFixed(1);

    const w = dialEl.clientWidth || 600;
    ticksEl.style.transform = "translateX(" + (w / 2 - xPos(freq)) + "px)";

    const s = DIAL[dialIdx];
    if (s) {
      if (stationDisplay.textContent !== s.n) {
        stationDisplay.textContent = s.n;
        stationDisplay.classList.remove("swap");
        void stationDisplay.offsetWidth;
        stationDisplay.classList.add("swap");
      }
      if (metaDisplay.dataset.lock !== "1") {
        const parts = [];
        if (s.l) parts.push(s.l);
        if (s.t) parts.push(s.t.split(",").slice(0, 2).join(" · "));
        metaText.textContent = parts.join("  ·  ") || "live stream";
        metaFlag.textContent = flag(s.cc);
      }
    } else {
      stationDisplay.textContent = "—";
      metaText.textContent = DIAL.length ? "rotate the dial to tune" : "no stations in this region";
      metaFlag.textContent = "";
    }

    highlightStationDot();
    if (!favSheet.classList.contains("hidden")) renderFavs();
  }

  // metaDisplay reference needed for lock
  const metaDisplay = metaText.parentElement;

  function tuneTo(i, autoplay) {
    if (!DIAL.length) return;
    stopScan();
    dialIdx = (i + DIAL.length) % DIAL.length;
    const s = DIAL[dialIdx];
    freq = s._fm;
    paint(true);
    if (autoplay) playStation(s);
  }

  function setFreq(f, snap, animate) {
    freq = Math.min(HI, Math.max(LO, f));
    if (snap && DIAL.length) dialIdx = nearestIdx(freq);
    paint(animate);
  }

  // ============================================================
  // FETCH
  // ============================================================
  function fetchT(url, ms, opts) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 8000);
    return fetch(url, Object.assign({ signal: ctl.signal }, opts || {}))
      .finally(() => clearTimeout(t));
  }

  async function rb(path, timeoutMs) {
    // Race mirrors; first to succeed wins
    const attempts = RB_MIRRORS.map(m =>
      fetchT(m + "/json" + path, timeoutMs || 9000).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
    );
    return Promise.any(attempts);
  }

  async function tryPerchance() {
    try {
      const idx = await fetchT(PERCHANCE_BASE + "/index.json", 5000).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
      if (!idx || !idx.countries) throw new Error("bad index");
      const [top, gj] = await Promise.all([
        fetchT(PERCHANCE_BASE + "/top.json", 6000).then(r => r.ok ? r.json() : []).catch(() => []),
        fetchT(PERCHANCE_BASE + "/genres.json", 6000).then(r => r.ok ? r.json() : { genres: [] }).catch(() => ({ genres: [] })),
      ]);
      return { source: "perchance", idx, top: Array.isArray(top) ? top : [], genres: gj.genres || [] };
    } catch(e) { return null; }
  }

  async function tryLocal() {
    try {
      const idx = await fetchT(LOCAL_BASE + "/index.json", 2500).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
      if (!idx || !idx.countries) throw new Error("bad index");
      const [top, gj] = await Promise.all([
        fetchT(LOCAL_BASE + "/top.json", 3000).then(r => r.ok ? r.json() : []).catch(() => []),
        fetchT(LOCAL_BASE + "/genres.json", 3000).then(r => r.ok ? r.json() : { genres: [] }).catch(() => ({ genres: [] })),
      ]);
      return { source: "local", idx, top: Array.isArray(top) ? top : [], genres: gj.genres || [] };
    } catch(e) { return null; }
  }

  async function fetchFromRadioBrowser() {
    setStatus("fetching radio-browser…");
    try {
      // Parallel fetch: top voted + top clicked + various tags
      const results = await Promise.allSettled([
        rb("/stations/topvote/1000?hidebroken=true&is_https=true"),
        rb("/stations/topclick/1000?hidebroken=true&is_https=true"),
        rb("/stations/search?limit=500&order=votes&reverse=true&hidebroken=true&is_https=true&has_geo_info=true"),
      ]);
      const raw = [];
      for (const r of results) if (r.status === "fulfilled" && Array.isArray(r.value)) raw.push(...r.value);
      if (!raw.length) throw new Error("no data");

      const stations = [];
      for (const s of raw) {
        let url = (s.url_resolved || s.url || "").trim();
        if (!url || !url.startsWith("https://")) continue;
        const codec = (s.codec || "").toUpperCase();
        // Prefer stable codecs
        const stable = codec.includes("MP3") || codec.includes("AAC") || codec.includes("MPEG");
        stations.push({
          n: (s.name || "Unknown").trim().replace(/\s+/g, " ").slice(0, 80),
          u: url,
          u2: s.url && s.url_resolved && s.url !== s.url_resolved && s.url.startsWith("https") ? s.url : null,
          cc: (s.countrycode || "ZZ").toUpperCase(),
          l: s.country || "",
          t: (s.tags || "").split(",").map(x => x.trim()).filter(Boolean).slice(0, 3).join(", "),
          https: true,
          v: (s.votes || 0) + (s.clickcount || 0) * 0.15 + (stable ? 50 : 0),
        });
      }
      stations.sort((a, b) => b.v - a.v);
      return stations;
    } catch(e) {
      console.warn("[radio] RB failed:", e.message || e);
      return null;
    }
  }

  // ============================================================
  // CACHE
  // ============================================================
  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.stations || Date.now() - d.t > CACHE_TTL) return null;
      return d.stations;
    } catch(e) { return null; }
  }
  function writeCache(stations) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        t: Date.now(),
        stations: stations.slice(0, CACHE_MAX),
      }));
    } catch(e){ /* quota */ }
  }

  // ============================================================
  // POPULATE FROM A STATION LIST
  // ============================================================
  function populateFromList(stations, sourceLabel, kind) {
    if (!stations || !stations.length) return false;
    ALL = []; seenUrls = new Set();
    addStations(stations);

    // Build country index
    const byCountry = {};
    for (const s of ALL) {
      const cc = s.cc || "ZZ";
      if (!byCountry[cc]) byCountry[cc] = { cc, c: s.l || cc, count: 0 };
      byCountry[cc].count++;
    }
    const countries = Object.values(byCountry).sort((a, b) => b.count - a.count);
    if (!countries.length) return false;

    countrySel.innerHTML = "";
    // "All regions" option
    const allOpt = document.createElement("option");
    allOpt.value = "__ALL__";
    allOpt.textContent = `All regions (${ALL.length})`;
    countrySel.appendChild(allOpt);
    for (const c of countries) {
      const o = document.createElement("option");
      o.value = c.cc;
      o.textContent = (flag(c.cc) ? flag(c.cc) + " " : "") + c.c + " (" + c.count + ")";
      countrySel.appendChild(o);
    }
    stationCount.textContent = ALL.length.toLocaleString() + " stations";

    // default to All regions so user sees everything
    countrySel.value = "__ALL__";
    applyPool();

    setStatus(sourceLabel, kind || "live");
    return true;
  }

  // ============================================================
  // APPLY POOL -> DIAL
  // ============================================================
  function applyPool() {
    const cc = countrySel.value;
    let pool = cc === "__ALL__" ? ALL.slice() : ALL.filter(s => (s.cc || "ZZ") === cc);
    if (!pool.length) pool = ALL.slice();

    pool.sort((a, b) => (b.v || 0) - (a.v || 0));

    // take top 120 for the dial, distribute over the visible band
    DIAL = pool.slice(0, 120);

    const n = DIAL.length;
    const lo = 87.9, hi = 107.9;
    DIAL.forEach((s, i) => {
      s._fm = n === 1 ? 98.8 : Math.round((lo + (hi - lo) * i / (n - 1)) * 10) / 10;
    });
    // ensure ascending
    for (let i = 1; i < DIAL.length; i++) {
      if (DIAL[i]._fm <= DIAL[i-1]._fm)
        DIAL[i]._fm = Math.min(108, Math.round((DIAL[i-1]._fm + 0.2) * 10) / 10);
    }

    buildTicks();
    updateStationDots();
    dialCount.textContent = DIAL.length + " on dial";

    dialIdx = DIAL.length ? Math.min(DIAL.length - 1, Math.floor(DIAL.length / 2)) : -1;
    current = null;
    if (DIAL.length) {
      freq = DIAL[dialIdx]._fm;
      paint(true);
      playStation(DIAL[dialIdx]);
    } else {
      paint(false);
    }
  }

  // ============================================================
  // PLAYBACK
  // ============================================================
  function stopHls() {
    if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  }

  async function resolvePlaylist(url) {
    try {
      const r = await fetchT(url, 4000);
      const txt = await r.text();
      const m = txt.match(/File1\s*=\s*(https?:[^\s]+)/i) || txt.match(/https?:[^\s"']+/);
      if (m) return m[1].replace(/[\r\n"']+$/, "");
    } catch(e){}
    return url;
  }

  function scheduleSkip(g) {
    if (g !== playGen || !wantPlaying || failCount >= 6) return;
    failCount++;
    setTimeout(() => {
      if (g === playGen && wantPlaying && DIAL.length) tuneTo(dialIdx + 1, true);
    }, 1200);
  }

  async function tryPlayUrl(url, g, isHls) {
    return new Promise((resolve) => {
      let resolved = false;
      const done = (ok) => {
        if (resolved) return;
        resolved = true;
        audioEl.removeEventListener("playing", onPlaying);
        audioEl.removeEventListener("error", onError);
        resolve(ok);
      };
      const onPlaying = () => { if (g === playGen) done(true); };
      const onError = () => { if (g === playGen) done(false); };
      audioEl.addEventListener("playing", onPlaying, { once: true });
      audioEl.addEventListener("error", onError, { once: true });

      if (isHls && window.Hls && Hls.isSupported() && !audioEl.canPlayType("application/vnd.apple.mpegurl")) {
        try { hls && hls.destroy(); } catch(e){}
        hls = new Hls({
          maxBufferLength: 30,
          liveSyncDurationCount: 3,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 2,
        });
        hls.loadSource(url);
        hls.attachMedia(audioEl);
        hls.on(Hls.Events.ERROR, (ev, data) => {
          if (data && data.fatal && g === playGen) {
            done(false);
          }
        });
      } else {
        audioEl.src = url;
      }
      const p = audioEl.play();
      if (p && p.catch) p.catch(() => done(false));
      setTimeout(() => done(false), 12000);
    });
  }

  async function playStation(s) {
    if (!s) return;
    current = s;
    const g = ++playGen;
    wantPlaying = true;

    const di = DIAL.indexOf(s);
    if (di >= 0) { dialIdx = di; freq = s._fm; }
    paint(true);
    stopHls();
    try { audioEl.pause(); } catch(e){}
    audioEl.removeAttribute("src");
    audioEl.load();

    stationDisplay.textContent = s.n;
    metaFlag.textContent = flag(s.cc);
    metaDisplay.dataset.lock = "1";
    metaText.textContent = "connecting";
    setPlayIcon("loading");
    indStereo.classList.remove("on");
    indSignal.classList.remove("on");

    const needTap = () => {
      if (g !== playGen) return;
      metaText.textContent = "tap play to listen";
      setPlayIcon("play");
    };

    let url = s.u;
    const f = fmtOf(s);
    if (f === "pls" || f === "m3u") url = await resolvePlaylist(s.u);
    if (g !== playGen) return;

    const isHls = url.includes(".m3u8");
    const ok = await tryPlayUrl(url, g, isHls);

    if (g !== playGen) return;

    if (!ok && s.u2) {
      // try alternate URL before skipping
      metaText.textContent = "trying alternate…";
      const ok2 = await tryPlayUrl(s.u2, g, s.u2.includes(".m3u8"));
      if (g !== playGen) return;
      if (!ok2) {
        metaText.textContent = "signal lost — seeking";
        setPlayIcon("play");
        scheduleSkip(g);
      }
    } else if (!ok) {
      metaText.textContent = "signal lost — seeking";
      setPlayIcon("play");
      scheduleSkip(g);
    }
  }

  audioEl.addEventListener("playing", () => {
    failCount = 0;
    setPlayIcon("pause");
    metaDisplay.dataset.lock = "";
    indStereo.classList.add("on");
    indSignal.classList.add("on");
    setStatus("on air", "live");
    if (current) {
      const parts = [];
      if (current.l) parts.push(current.l);
      if (current.t) parts.push(current.t.split(",").slice(0, 2).join(" · "));
      metaText.textContent = parts.join("  ·  ") || "live stream";
    }
  });

  function onStopped() {
    setPlayIcon("play");
    indStereo.classList.remove("on");
    indSignal.classList.remove("on");
    setStatus("standby", "");
    paint(false);
  }
  audioEl.addEventListener("pause", onStopped);
  audioEl.addEventListener("error", () => {
    if (current && audioEl.src) {
      metaDisplay.dataset.lock = "1";
      metaText.textContent = "weak signal";
      scheduleSkip(playGen);
      onStopped();
    }
  });

      if (navigator.share) { await navigator.share({ title: s.n, text: s.n + " · live radio", url: s.u }); return; }
      if (navigator.clipboard) {

        metaText.textContent = "link copied";

  // ============================================================
  // DIAL DRAG
  // ============================================================
  (function(){
    let down = false, sx = 0, sf = 0, moved = false, raf = null;
    dialWrap.addEventListener("pointerdown", e => {
      down = true; moved = false; sx = e.clientX; sf = freq;
      try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch(err){}
    });
    window.addEventListener("pointermove", e => {
      if (!down) return;
      const dx = e.clientX - sx;
      if (Math.abs(dx) > 3) moved = true;
      const nf = sf - dx / PX;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        setFreq(nf, false, false);
        dialIdx = nearestIdx(freq);
        paint(false);
      });
    });
    window.addEventListener("pointerup", () => {
      if (!down) return;
      down = false;
      if (moved && DIAL.length) tuneTo(nearestIdx(freq), true);
    });
  })();

  // ============================================================
  // LOAD FROM A BASE URL (perchance-style: index.json + top.json)
  // ============================================================
  async function tryLoadFromBase(base, label) {
    try {
      const idx = await fetchT(base + "/index.json", 6000).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
      if (!idx || !idx.countries) throw new Error("bad index");
      const [top, gj] = await Promise.all([
        fetchT(base + "/top.json", 8000).then(r => r.ok ? r.json() : []).catch(() => []),
        fetchT(base + "/genres.json", 8000).then(r => r.ok ? r.json() : { genres: [] }).catch(() => ({ genres: [] })),
      ]);
      return { source: label, idx, top: Array.isArray(top) ? top : [], genres: gj.genres || [] };
    } catch(e) { return null; }
  }

  function applyLoaded(loaded) {
    ALL = []; seenUrls = new Set();
    addStations(loaded.top || []);
    // Build country index from the perchance data
    if (loaded.idx && loaded.idx.countries) {
      const countries = loaded.idx.countries.slice().sort((a,b) => (b.parts||0) - (a.parts||0));
      countrySel.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "__ALL__";
      allOpt.textContent = `All regions (${loaded.idx.total || ALL.length})`;
      countrySel.appendChild(allOpt);
      for (const c of countries) {
        const o = document.createElement("option");
        o.value = c.cc;
        o.textContent = (flag(c.cc) ? flag(c.cc) + " " : "") + (c.c || c.cc);
        countrySel.appendChild(o);
      }
      stationCount.textContent = (loaded.idx.total || ALL.length).toLocaleString() + " stations";
    }
    countrySel.value = "__ALL__";
    applyPool();
    setStatus(loaded.source, "live");
  }

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    // 1. Kick off perchance + local in parallel
    const [perch, local] = await Promise.all([tryPerchance(), tryLocal()]);
    if (local) { applyLoaded(local); return; }
    if (perch) { applyLoaded(perch); return; }

    // 2. Cached RB data?
    const cached = readCache();
    if (cached && cached.length) {
      populateFromList(cached, "cached", "warn");
      // refresh in background
      fetchFromRadioBrowser().then(fresh => {
        if (fresh && fresh.length) {
          writeCache(fresh);
          populateFromList(fresh, "radio-browser", "live");
        }
      });
      return;
    }

    // 3. Fetch fresh from RB
    const fresh = await fetchFromRadioBrowser();
    if (fresh && fresh.length) {
      writeCache(fresh);
      populateFromList(fresh, "radio-browser", "live");
      return;
    }

    // 4. Demo fallback
    loadDemo();
  }

    ];
    ALL = []; seenUrls = new Set();
    addStations(demo);
    const byCountry = {};
    for (const s of demo) {
      const cc = s.cc;
      if (!byCountry[cc]) byCountry[cc] = { cc, c: s.l, count: 0 };
      byCountry[cc].count++;
    }
    const countries = Object.values(byCountry).sort((a,b) => b.count - a.count);
    countrySel.innerHTML = "";
    const allOpt = document.createElement("option");
    allOpt.value = "__ALL__"; allOpt.textContent = `All regions (${demo.length})`;
    countrySel.appendChild(allOpt);
    for (const c of countries) {
      const o = document.createElement("option");
      o.value = c.cc;
      o.textContent = flag(c.cc) + " " + c.c + " (" + c.count + ")";
      countrySel.appendChild(o);
    }
    stationCount.textContent = demo.length + " stations";
    countrySel.value = "__ALL__";
    applyPool();
    setStatus("demo mode", "warn");
  }

  // ============================================================
  // INIT
  // ============================================================
  buildTicks();
  paint(false);
  setVol(0.8);

  boot().catch(e => {
    console.warn("[radio] boot error:", e);
    setStatus("boot error", "err");
    buildTicks();
    paint(false);
  });

  window.addEventListener("resize", () => {
    buildTicks();
    updateStationDots();
    paint(false);
  });

  // ============================================================
  // EDITOR (file:// + #edit)
  // ============================================================
  document.addEventListener("DOMContentLoaded", function() {
    if (!window.location.href.startsWith("file:") || window.location.hash !== "#edit") return;
    const originalHtmlText = document.documentElement.outerHTML;
    const parseNotjsData = t => {
      try { return JSON.parse(t[0] === "{" || t[0] === "[" ? t : decodeURI(t)); }
      catch(e) { return null; }
    };
    const preEl = document.querySelector("#preloaded-generator-data");
    const impEl = document.querySelector("#imported-generators");
    if (!preEl) return;
    const preData = parseNotjsData(preEl.textContent);
    const impGens = impEl ? parseNotjsData(impEl.textContent) : [];
    if (!preData) return;

    const overlay = document.getElementById("editorOverlay");
    overlay.classList.remove("hidden");
    overlay.innerHTML = "";

    const header = document.createElement("div");
    header.className = "editor-header";
    header.innerHTML = '<button class="drag-handle">⠿ drag</button><button class="save-button">save</button><div class="editor-tabs"></div>';
    overlay.appendChild(header);
    const body = document.createElement("div");
    body.className = "editor-body";
    overlay.appendChild(body);

    (function makeDraggable(el){
      const dh = el.querySelector(".drag-handle");
      let sx, sy, ex, ey;
      dh.addEventListener("mousedown", e => {
        e.preventDefault();
        sx = e.clientX; sy = e.clientY;
        document.addEventListener("mouseup", close);
        document.addEventListener("mousemove", move);
      });
      function move(e){
        e.preventDefault();
        ex = sx - e.clientX; ey = sy - e.clientY;
        sx = e.clientX; sy = e.clientY;
        el.style.top = (el.offsetTop - ey) + "px";
        el.style.left = (el.offsetLeft - ex) + "px";
      }
      function close(){
        document.removeEventListener("mouseup", close);
        document.removeEventListener("mousemove", move);
      }
    })(overlay);

    const editors = [
      { name: preData.name, content: preData.modelText, main: true, type: "lists", visible: true },
      { name: preData.name, content: preData.outputTemplate, main: true, type: "html", visible: false },
    ];
    for (const g of (impGens || [])) editors.push({ name: g.name, content: g.modelText, visible: false });

    function save() {
      const pNew = JSON.parse(JSON.stringify(preData));
      pNew.modelText = editors.find(e => e.main && e.type === "lists").textArea.value;
      pNew.outputTemplate = editors.find(e => e.main && e.type === "html").textArea.value;
      const iNew = JSON.parse(JSON.stringify(impGens || []));
      for (const e of editors) {
        if (e.main) continue;
        const f = iNew.find(x => x.name === e.name);
        if (f) f.modelText = e.textArea.value;
      }
      let text = originalHtmlText;
      text = text.replace(/(<script id="preloaded-generator-data"[^>]*>)(.+?)(<\/script>)/, `$1${encodeURI(JSON.stringify(pNew))}$3`);
      text = text.replace(/(<script id="imported-generators"[^>]*>)(.+?)(<\/script>)/, `$1${encodeURI(JSON.stringify(iNew))}$3`);
      const blob = new Blob([text], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = pNew.name + ".html";
      a.style.display = "none";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    header.querySelector(".save-button").onclick = save;
    document.addEventListener("keydown", e => {
      if (e.key === "s" && (navigator.platform.match("Mac") ? e.metaKey : e.ctrlKey)) { e.preventDefault(); save(); }
    });

    const tabsC = header.querySelector(".editor-tabs");
    for (const ed of editors) {
      const ta = document.createElement("textarea");
      ta.style.display = ed.visible ? "block" : "none";
      ta.value = ed.content;
      body.appendChild(ta);
      ed.textArea = ta;
      const btn = document.createElement("button");
      btn.textContent = ed.name + (ed.type === "html" ? " (html)" : "");
      if (ed.main) btn.style.fontWeight = "600";
      if (ed.visible) btn.classList.add("active");
      btn.onclick = () => {
        editors.forEach(x => { x.textArea.style.display = "none"; x.tabButton.classList.remove("active"); });
        ta.style.display = "block"; btn.classList.add("active");
      };
      tabsC.appendChild(btn);
      ed.tabButton = btn;
    }

    let attempts = 0;
    const iv = setInterval(() => {
      if (!document.body.contains(overlay)) document.body.appendChild(overlay);
      if (++attempts > 20) clearInterval(iv);
    }, 500);
  });

})();
  </script>
</body>
