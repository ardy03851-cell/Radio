        closeSheet();
        closeMap();
        break;
    }
  });

  // First-load hint
  setTimeout(flashHints, 1800);

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    // Try perchance first
    const perch = await tryLoadFromBase(PERCHANCE_BASE, "perchance");
    if (perch) {
      ALL = []; seenUrls = new Set();
      addStations(perch.top || []);
      const countries = perch.idx.countries.slice().sort((a,b) => (b.parts||0) - (a.parts||0));
      countryNames = Object.fromEntries(countries.map(c => [c.cc, c.c || c.cc]));
      countrySel.innerHTML = "";
      const allOpt = document.createElement("option");
      allOpt.value = "__ALL__";
      allOpt.textContent = `All regions · ${(perch.idx.total || ALL.length).toLocaleString()}`;
      countrySel.appendChild(allOpt);
      for (const c of countries) {
        const o = document.createElement("option");
        o.value = c.cc;
        o.textContent = superSignal ? spaceCountryName(c.cc) : ((flag(c.cc) ? flag(c.cc) + " " : "") + (c.c || c.cc));
        countrySel.appendChild(o);
      }
      countrySel.value = "__ALL__";
      applyPool();
      setStatus("live", "on");
      return;
    }

    // Cached RB?
    const cached = readCache();
    if (cached && cached.length) {
      populateFromList(cached, "cached", "on");
      fetchFromRadioBrowser().then(fresh => {
        if (fresh && fresh.length) {
          writeCache(fresh);
          populateFromList(fresh, "live", "on");
        }
      });
      return;
    }

    // Fresh RB
    const fresh = await fetchFromRadioBrowser();
    if (fresh && fresh.length) {
      writeCache(fresh);
      populateFromList(fresh, "live", "on");
      return;
    }

    // Demo fallback
    loadDemo();
  }

  function loadDemo() {
    const demo = [
      { n: "SomaFM Groove Salad", u: "https://ice1.somafm.com/groovesalad-128-mp3", cc: "US", l: "United States", t: "ambient, electronic", https: true, v: 5000 },
      { n: "SomaFM Drone Zone", u: "https://ice1.somafm.com/dronezone-128-mp3", cc: "US", l: "United States", t: "ambient", https: true, v: 4800 },
      { n: "SomaFM Lush", u: "https://ice1.somafm.com/lush-128-mp3", cc: "US", l: "United States", t: "chillout", https: true, v: 4600 },
      { n: "Radio Paradise", u: "https://stream.radioparadise.com/mp3-192", cc: "US", l: "United States", t: "eclectic, rock", https: true, v: 5200 },
      { n: "BBC Radio 6 Music", u: "https://stream.live.vc.bbcmedia.co.uk/bbc_6music", cc: "GB", l: "United Kingdom", t: "alternative, indie", https: true, v: 8500 },
      { n: "FIP", u: "https://icecast.radiofrance.fr/fip-midfi.mp3", cc: "FR", l: "France", t: "eclectic, jazz", https: true, v: 7000 },
      { n: "Jazz24", u: "https://live.wostreaming.net/direct/ppm-jazz24mp3-ibc1", cc: "US", l: "United States", t: "jazz", https: true, v: 6400 },
      { n: "KEXP", u: "https://kexp-mp3-128.streamguys1.com/kexp128.mp3", cc: "US", l: "United States", t: "alternative", https: true, v: 6200 },
    ];
    ALL = []; seenUrls = new Set();
    addStations(demo);
    const byCountry = {};
    for (const s of demo) {
      const cc = s.cc;
      if (!byCountry[cc]) byCountry[cc] = { cc, c: s.l, count: 0 };
      byCountry[cc].count++;
    }
    countrySel.innerHTML = "";
    const allOpt = document.createElement("option");
    allOpt.value = "__ALL__"; allOpt.textContent = `All regions · ${demo.length}`;
    countrySel.appendChild(allOpt);
    for (const c of Object.values(byCountry)) {
      const o = document.createElement("option");
      o.value = c.cc;
      o.textContent = flag(c.cc) + " " + c.c + " · " + c.count;
      countrySel.appendChild(o);
    }
    countrySel.value = "__ALL__";
    applyPool();
    setStatus("demo", "demo");
  }

  // init
  buildTicks();
  paint(false);
  setVol(0.8);

  boot().catch(e => {
    console.warn("[radio] boot error:", e);
    setStatus("error", "err");
    loadDemo();
  });

  window.addEventListener("resize", () => {
    buildTicks();
    updateStationDots();
    paint(false);
  });

  // fullscreen button icon sync
  document.addEventListener("fullscreenchange", () => {
    fullscreenBtn.title = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
  });

})();
  </script>
</body>
