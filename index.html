<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Receiver</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #121216;
      --surface-2: #1a1a1f;
      --line: #232329;
      --line-2: #2e2e36;
      --text: #ececef;
      --dim: #8a8a92;
      --faint: #4a4a52;
      --accent: #e6543a;
      --green: #4a9d68;
      --amber: #d99a2b;
      --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --eo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* ============ AMBIENT BACKGROUND ============ */
    .ambient {
      position: fixed;
      inset: -20%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.5;
    }

    .ambient::before,
    .ambient::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      animation: drift 60s ease-in-out infinite;
    }

    .ambient::before {
      width: 55vw;
      height: 55vw;
      top: 5%;
      left: 10%;
      background: radial-gradient(circle, rgba(230, 84, 58, 0.22), transparent 65%);
      animation-delay: 0s;
    }

    .ambient::after {
      width: 60vw;
      height: 60vw;
      bottom: 5%;
      right: 5%;
      background: radial-gradient(circle, rgba(80, 120, 200, 0.14), transparent 65%);
      animation-delay: -30s;
    }

    @keyframes drift {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(8%, -6%) scale(1.08);
      }

      66% {
        transform: translate(-6%, 8%) scale(0.95);
      }
    }

    /* subtle grid */
    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    }

    /* ============ LAYOUT ============ */
    .app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto auto auto;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ============ TOP BAR ============ */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 28px 12px;
      gap: 16px;
      animation: slide-down 0.6s var(--eo) both;
    }

    @keyframes slide-down {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .clock {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .clock .time {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
    }

    .clock .date {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 500;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      padding: 6px 12px;
      border-radius: 100px;
      border: 1px solid var(--line);
      background: rgba(18, 18, 22, 0.6);
      backdrop-filter: blur(10px);
      transition: all 0.3s var(--eo);
    }

    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status.on .dot {
      background: var(--green);
      box-shadow: 0 0 8px rgba(74, 157, 104, 0.7);
      animation: pulse 2s ease-in-out infinite;
    }

    .status.demo .dot {
      background: var(--amber);
      box-shadow: 0 0 8px rgba(217, 154, 43, 0.6);
    }

    .status.err {
      color: var(--accent);
    }

    .status.err .dot {
      background: var(--accent);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(18, 18, 22, 0.6);
      border: 1px solid var(--line);
      color: var(--dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.2s var(--eo);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s var(--eo);
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--line-2);
      background: var(--surface);
    }

    .icon-btn:hover svg {
      transform: scale(1.1);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* ============ CENTER (FREQUENCY + STATION) ============ */
    .center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
      min-height: 0;
    }

    .freq-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .freq {
      display: flex;
      align-items: baseline;
      gap: 12px;
      position: relative;
    }

    .freq-value {
      font-family: var(--mono);
      font-size: clamp(72px, 15vw, 180px);
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
      line-height: 0.85;
      color: var(--text);
      transition: color 0.5s var(--eo), text-shadow 0.5s var(--eo);
      display: inline-block;
    }

    .freq-value.tuning {
      color: var(--accent);
      text-shadow: 0 0 60px rgba(230, 84, 58, 0.4);
    }

    /* digit roll */
    .digit-col {
      display: inline-block;
      height: 1em;
      overflow: hidden;
      vertical-align: baseline;
      position: relative;
      width: 0.62em;
    }

    .digit-col .digit-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      transition: transform 0.5s var(--eo);
      will-change: transform;
    }

    .digit-col .digit-track span {
      display: block;
      height: 1em;
      line-height: 0.85;
      text-align: center;
    }

    .freq-unit {
      font-family: var(--mono);
      font-size: clamp(14px, 2vw, 22px);
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--dim);
    }

    .station-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 720px;
      text-align: center;
      min-height: 68px;
      justify-content: center;
    }

    .station-name {
      font-size: clamp(20px, 3.4vw, 34px);
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      transition: opacity 0.35s var(--eo), transform 0.35s var(--eo);
    }

    .station-name.swap {
      animation: name-swap 0.5s var(--eo);
    }

    @keyframes name-swap {
      0% {
        opacity: 0;
        transform: translateY(8px);
        filter: blur(4px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .station-meta {
      font-family: var(--mono);
      font-size: clamp(11px, 1.1vw, 13px);
      letter-spacing: 1px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .station-meta .sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
    }

    /* ============ DIAL ============ */
    .dial-section {
      padding: 0 0 4px;
      animation: fade-up 0.7s var(--eo) 0.15s both;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dial-wrap {
      position: relative;
      height: 88px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.15));
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
      touch-action: none;
      cursor: ew-resize;
      transition: border-color 0.3s;
    }

    .dial-wrap:hover {
      border-color: var(--line-2);
    }

    .dial-wrap:active {
      border-color: var(--accent);
    }

    .dial-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg,
          var(--bg) 0%, transparent 5%,
          transparent 95%, var(--bg) 100%);
      z-index: 4;
    }

    .dial {
      overflow: hidden;
      height: 100%;
      position: relative;
    }

    .ticks {
      position: absolute;
      top: 0;
      height: 100%;
      will-change: transform;
      transition: none;
    }

    .tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: #1e1e24;
      transition: background 0.2s;
    }

    .tick.maj {
      background: #35353d;
      width: 2px;
    }

    .dial-wrap:hover .tick.maj {
      background: #45454e;
    }

    .dial-wrap:active .tick.maj {
      background: var(--accent);
    }

    .tick-label {
      position: absolute;
      top: 10px;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s;
    }

    .dial-wrap:hover .tick-label {
      color: var(--dim);
    }

    .needle {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      margin-left: -1px;
      background: var(--accent);
      box-shadow: 0 0 20px rgba(230, 84, 58, 0.6), 0 0 4px var(--accent);
      z-index: 3;
      transition: box-shadow 0.3s;
    }

    .needle::before,
    .needle::after {
      content: '';
      position: absolute;
      left: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      background: var(--accent);
      transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(230, 84, 58, 0.6);
    }

    .needle::before {
      top: -4px;
    }

    .needle::after {
      bottom: -4px;
    }

    .station-dot {
      position: absolute;
      bottom: 8px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--faint);
      transform: translateX(-50%);
      opacity: 0.4;
      z-index: 2;
      transition: opacity 0.3s, background 0.3s, transform 0.3s var(--eo), box-shadow 0.3s;
    }

    .station-dot.near {
      background: var(--accent);
      opacity: 1;
      transform: translateX(-50%) scale(2);
      box-shadow: 0 0 8px rgba(230, 84, 58, 0.8);
    }

    /* ============ TRANSPORT ============ */
    .transport {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      padding: 30px 24px 22px;
      animation: fade-up 0.7s var(--eo) 0.25s both;
    }

    .tbtn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--eo);
    }

    .tbtn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.2s var(--eo);
    }

    .tbtn:hover {
      color: var(--text);
      border-color: var(--line-2);
      background: var(--surface);
      transform: scale(1.05);
    }

    .tbtn:hover svg {
      transform: scale(1.1);
    }

    .tbtn:active {
      transform: scale(0.92);
    }

    .play-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow:
        0 0 0 0 rgba(230, 84, 58, 0.5),
        0 10px 30px rgba(230, 84, 58, 0.3),
        0 2px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.3s var(--eo);
    }

    .play-btn::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.4s var(--eo);
    }

    .play-btn:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 0 8px rgba(230, 84, 58, 0.12),
        0 12px 36px rgba(230, 84, 58, 0.4),
        0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .play-btn:hover::before {
      opacity: 0.5;
      transform: scale(1);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn svg {
      width: 30px;
      height: 30px;
      fill: #fff;
      transition: transform 0.2s var(--eo);
    }

    .play-btn.playing svg {
      animation: gentle-pulse 2.4s ease-in-out infinite;
    }

    @keyframes gentle-pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(0.92);
      }
    }

    /* sleep ring on play button */
    .play-btn .sleep-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid var(--amber);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .play-btn.sleeping .sleep-ring {
      opacity: 1;
      animation: ring-fade 3s linear infinite;
    }

    @keyframes ring-fade {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.4;
      }
    }

    /* ============ BOTTOM BAR ============ */
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px 22px;
      gap: 16px;
      border-top: 1px solid var(--line);
      background: rgba(10, 10, 12, 0.6);
      backdrop-filter: blur(12px);
      animation: slide-up 0.6s var(--eo) 0.35s both;
      flex-wrap: wrap;
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .util-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ubtn {
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: all 0.2s var(--eo);
      white-space: nowrap;
    }

    .ubtn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s var(--eo);
    }

    .ubtn:hover {
      color: var(--text);
      border-color: var(--line-2);
      background: var(--surface);
      transform: translateY(-1px);
    }

    .ubtn:hover svg {
      transform: scale(1.1);
    }

    .ubtn:active {
      transform: translateY(0) scale(0.97);
    }

    .ubtn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(230, 84, 58, 0.08);
    }

    .ubtn.active svg {
      animation: spin-slow 2.5s linear infinite;
    }

    @keyframes spin-slow {
      to {
        transform: rotate(360deg);
      }
    }

    .ubtn.icon-only {
      width: 38px;
      padding: 0;
      justify-content: center;
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      justify-content: flex-end;
      min-width: 0;
    }

    .region-wrap {
      position: relative;
    }

    .region-wrap svg {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 11px;
      height: 11px;
      stroke: var(--faint);
      fill: none;
      stroke-width: 2.2;
      pointer-events: none;
      transition: transform 0.25s var(--eo);
    }

    .region-wrap:hover svg {
      transform: translateY(-50%) translateY(2px);
    }

    select {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 30px 10px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text);
      outline: none;
      cursor: pointer;
      max-width: 220px;
      text-overflow: ellipsis;
      transition: border-color 0.2s, background 0.2s;
    }

    select:hover {
      border-color: var(--line-2);
      background: var(--surface);
    }

    select:focus {
      border-color: var(--accent);
    }

    select option {
      background: var(--surface-2);
      color: var(--text);
    }

    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      transition: border-color 0.2s, background 0.2s;
    }

    .vol-wrap:hover {
      border-color: var(--line-2);
      background: var(--surface);
    }

    .vol-wrap svg {
      width: 14px;
      height: 14px;
      stroke: var(--dim);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      border-radius: 2px;
      background: var(--line);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      box-shadow: 0 0 0 2px var(--bg), 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: background 0.15s, transform 0.15s var(--eo);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--accent);
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text);
      border: none;
    }

    /* ============ FAVORITES SHEET ============ */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--eo);
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 70vh;
      background: var(--surface);
      border-top: 1px solid var(--line-2);
      border-radius: 20px 20px 0 0;
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.4s var(--eo);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .sheet.open {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px 12px;
      border-bottom: 1px solid var(--line);
    }

    .sheet-header .title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-header .title svg {
      width: 14px;
      height: 14px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--dim);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--eo);
    }

    .close-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .close-btn:hover {
      color: var(--text);
      border-color: var(--line-2);
      transform: rotate(90deg);
    }

    .fav-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 24px;
    }

    .fav-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s var(--eo);
      border: 1px solid transparent;
      margin-bottom: 4px;
    }

    .fav-item:hover {
      background: var(--surface-2);
      border-color: var(--line);
    }

    .fav-item .info {
      flex: 1;
      min-width: 0;
    }

    .fav-item .name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-item .detail {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      margin-top: 3px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-item .remove {
      background: none;
      border: none;
      color: var(--faint);
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .fav-item .remove svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .fav-item .remove:hover {
      color: var(--accent);
      background: rgba(230, 84, 58, 0.1);
    }

    .empty-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.6px;
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(18, 18, 22, 0.95);
      border: 1px solid var(--line-2);
      border-radius: 100px;
      padding: 10px 18px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(12px);
      transition: all 0.4s var(--eo);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============ KEYBOARD HINTS ============ */
    .kb-hints {
      position: fixed;
      top: 80px;
      right: 24px;
      background: rgba(18, 18, 22, 0.9);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.6px;
      color: var(--dim);
      z-index: 60;
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-6px);
      transition: all 0.35s var(--eo);
      pointer-events: none;
      line-height: 2;
    }

    .kb-hints.show {
      opacity: 1;
      transform: translateY(0);
    }

    .kb-hints kbd {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text);
      margin-right: 4px;
      min-width: 20px;
      text-align: center;
    }

    .kb-hints .h {
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: block;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 9px;
    }


    /* ============ SUPER SIGNAL / WORLD MAP ============ */
    body.super-signal {
      --bg: #02050a;
      --surface: #070d15;
      --surface-2: #0b1420;
      --line: #172534;
      --line-2: #294057;
      --text: #e8f0f7;
      --dim: #8195a8;
      --faint: #3b4e60;
      --accent: #8ea8c0;
      --green: #78a68b;
      --amber: #b89b67;
      background:
        radial-gradient(circle at 50% 42%, rgba(58, 86, 112, .11), transparent 35%),
        radial-gradient(circle at 15% 15%, rgba(103, 130, 160, .07), transparent 28%),
        #02050a;
    }

    body.super-signal .ambient {
      opacity: .22;
      filter: blur(100px);
    }

    body.super-signal .ambient::before {
      background: radial-gradient(circle, rgba(96, 125, 154, .12), transparent 68%);
    }

    body.super-signal .ambient::after {
      background: radial-gradient(circle, rgba(45, 73, 103, .12), transparent 68%);
    }

    body.super-signal .grid-bg {
      background-image:
        linear-gradient(rgba(139, 167, 193, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 167, 193, .025) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    body.super-signal .play-btn {
      background: #9aafc2;
      color: #061019;
      box-shadow: 0 0 0 1px rgba(170, 194, 214, .15), 0 12px 32px rgba(0, 0, 0, .55);
    }

    body.super-signal .needle {
      background: #b5c8d8;
      box-shadow: 0 0 18px rgba(143, 174, 201, .5), 0 0 4px #b5c8d8;
    }

    body.super-signal .needle::before,
    body.super-signal .needle::after {
      background: #b5c8d8;
      box-shadow: 0 0 9px rgba(143, 174, 201, .45);
    }

    body.super-signal .station-dot.near {
      background: #b5c8d8;
      box-shadow: 0 0 8px rgba(143, 174, 201, .6);
    }

    body.super-signal .super-only-label {
      display: inline;
    }

    .super-only-label {
      display: none;
    }

    .mode-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ubtn.super-btn.active {
      color: #b8c9d8;
      border-color: #70879b;
      background: rgba(112, 135, 155, .12);
    }

    .ubtn.map-btn.active {
      color: var(--text);
      border-color: var(--line-2);
      background: var(--surface);
    }

    .map-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(1, 4, 8, .84);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s var(--eo);
    }

    .map-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .map-panel {
      position: fixed;
      inset: 5vh 4vw;
      z-index: 80;
      border: 1px solid var(--line-2);
      border-radius: 18px;
      background: rgba(7, 12, 18, .97);
      box-shadow: 0 30px 100px rgba(0, 0, 0, .65);
      overflow: hidden;
      transform: translateY(18px) scale(.985);
      opacity: 0;
      pointer-events: none;
      transition: transform .4s var(--eo), opacity .35s var(--eo);
    }

    .map-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .map-head {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(3, 8, 13, .72);
      position: relative;
      z-index: 3;
    }

    .map-title {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--dim);
    }

    .map-title strong {
      color: var(--text);
      font-weight: 600;
    }

    .map-stage {
      position: absolute;
      inset: 58px 0 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(44, 67, 91, .12), transparent 48%),
        #02060b;
    }

    .map-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(207, 223, 235, .42) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(130, 159, 184, .25) 0 1px, transparent 1.2px);
      background-size: 113px 97px, 181px 151px;
      background-position: 13px 7px, 61px 38px;
      opacity: 0;
      transition: opacity .4s;
    }

    body.super-signal .map-stage::after {
      opacity: .35;
    }

    .map-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-land {
      fill: rgba(110, 130, 146, .16);
      stroke: rgba(139, 160, 178, .22);
      stroke-width: .7;
      transition: fill .4s, stroke .4s;
    }

    body.super-signal .map-land {
      fill: rgba(108, 136, 162, .13);
      stroke: rgba(159, 185, 207, .28);
    }

    .map-graticule {
      fill: none;
      stroke: rgba(132, 153, 171, .08);
      stroke-width: .7;
    }

    .country-node {
      fill: #879bab;
      stroke: #0a1118;
      stroke-width: 1.5;
      cursor: pointer;
      transition: r .2s, fill .2s, opacity .2s;
    }

    .country-node:hover,
    .country-node.active {
      fill: #d5e1ea;
      r: 5.5;
    }

    body.super-signal .country-node {
      fill: #a7bacc;
    }

    .map-label {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 1px;
      fill: #a5b4c0;
      pointer-events: none;
    }

    .map-tooltip {
      position: absolute;
      width: min(330px, calc(100% - 24px));
      left: 24px;
      bottom: 24px;
      padding: 16px;
      border: 1px solid var(--line-2);
      border-radius: 12px;
      background: rgba(5, 10, 15, .94);
      box-shadow: 0 16px 50px rgba(0, 0, 0, .5);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 4;
    }

    .map-tooltip.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .map-tooltip .country {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 6px;
    }

    .map-tooltip .station {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-tooltip .detail {
      margin-top: 5px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .map-tooltip .controls {
      display: flex;
      gap: 7px;
      margin-top: 12px;
    }

    .map-tip-btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      border-radius: 7px;
      height: 30px;
      padding: 0 11px;
      font: 600 9px var(--mono);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .map-tip-btn:hover {
      color: var(--text);
      border-color: var(--line-2);
      background: var(--surface);
    }

    .map-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--faint);
      font: 10px var(--mono);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .map-panel {
        inset: 2vh 2vw;
        border-radius: 14px;
      }

      .map-head {
        height: 52px;
      }

      .map-stage {
        inset: 52px 0 0;
      }

      .map-tooltip {
        left: 12px;
        bottom: 12px;
      }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 640px) {
      .top {
        padding: 16px 18px 8px;
      }

      .clock .time {
        font-size: 13px;
      }

      .clock .date {
        font-size: 9px;
      }

      .bottom {
        padding: 12px 16px 18px;
        gap: 10px;
      }

      .ubtn {
        padding: 0 10px;
        font-size: 9px;
      }

      .ubtn span:not(.lbl-hidden) {
        display: none;
      }

      .ubtn.icon-only {
        width: 38px;
        padding: 0;
      }

      .transport {
        gap: 22px;
        padding: 22px 16px 18px;
      }

      .play-btn {
        width: 72px;
        height: 72px;
      }

      .play-btn svg {
        width: 26px;
        height: 26px;
      }

      .tbtn {
        width: 46px;
        height: 46px;
      }

      .vol-wrap {
        padding: 0 10px;
      }

      input[type="range"] {
        width: 70px;
      }

      select {
        padding: 8px 26px 8px 10px;
        font-size: 10px;
        max-width: 140px;
      }

      .station-info {
        min-height: 56px;
      }
    }

    @media (max-width: 440px) {
      .right-group {
        width: 100%;
        justify-content: space-between;
      }

      .region-wrap {
        flex: 1;
      }

      select {
        max-width: none;
        width: 100%;
      }

      .vol-wrap {
        flex: 1;
      }

      input[type="range"] {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="ambient"></div>
  <div class="grid-bg"></div>

  <div class="app">

    <!-- TOP -->
    <header class="top">
      <div class="clock">
        <span class="time" id="clockTime">--:--</span>
        <span class="date" id="clockDate">—</span>
      </div>
      <div class="status" id="statusPill">
        <span class="dot"></span>
        <span id="statusText">standby</span>
      </div>
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    </header>

    <!-- CENTER -->
    <main class="center">
      <div class="freq-wrap" id="freqWrap" title="Double-click for a random station">
        <div class="freq">
          <span class="freq-value" id="freqDisplay">98.8</span>
          <span class="freq-unit">MHz</span>
        </div>
      </div>
      <div class="station-info">
        <div class="station-name" id="stationDisplay">—</div>
        <div class="station-meta" id="stationMeta">
          <span id="metaText">initializing</span>
        </div>
      </div>
    </main>

    <!-- DIAL -->
    <div class="dial-section">
      <div class="dial-wrap" id="dialWrap">
        <div class="dial" id="dialEl">
          <div class="ticks" id="ticksEl"></div>
        </div>
        <div class="needle"></div>
      </div>
    </div>

    <!-- TRANSPORT -->
    <div class="transport">
      <button class="tbtn" id="prevBtn" title="Previous (←)">
      <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><rect x="4" y="5" width="2.5" height="14"/></svg>
    </button>
      <button class="play-btn" id="playBtn" title="Play / Pause (Space)">
      <span class="sleep-ring"></span>
      <svg viewBox="0 0 24 24" id="playIcon"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    </button>
      <button class="tbtn" id="nextBtn" title="Next (→)">
      <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17.5" y="5" width="2.5" height="14"/></svg>
    </button>
    </div>

    <!-- BOTTOM -->
    <footer class="bottom">
      <div class="util-group">
        <button class="ubtn" id="scanBtn" title="Scan (S)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Scan</span>
      </button>
        <button class="ubtn" id="sleepBtn" title="Sleep timer (T)">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="sleepLabel">Sleep</span>
      </button>
        <button class="ubtn" id="favBtn" title="Favorites (F)">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Favs</span>
      </button>
        <button class="ubtn icon-only" id="shareBtn" title="Share (C)">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      </div>


      <div class="mode-group">
        <button class="ubtn map-btn" id="mapBtn" title="World map">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>
            <span>Map</span>
          </button>
        <button class="ubtn super-btn" id="superBtn" title="Super Signal — visual mode">
            <svg viewBox="0 0 24 24"><path d="M12 2v5M12 17v5M4.93 4.93l3.54 3.54M15.53 15.53l3.54 3.54M2 12h5M17 12h5M4.93 19.07l3.54-3.54M15.53 8.47l3.54-3.54"/></svg>
            <span>Super Signal</span>
          </button>
      </div>

      <div class="right-group">
        <div class="region-wrap">
          <select id="countrySel" title="Region"><option value="">loading</option></select>
          <svg viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </div>
        <div class="vol-wrap">
          <svg viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          </svg>
          <input type="range" id="volSlider" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </footer>
  </div>

  <!-- FAVORITES SHEET -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="favSheet">
    <div class="sheet-header">
      <span class="title">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Saved · <span id="favCount">0</span>
      </span>
      <button class="close-btn" id="favClose">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    </div>
    <div class="fav-list" id="favList"></div>
  </div>


  <!-- WORLD MAP -->
  <div class="map-backdrop" id="mapBackdrop"></div>
  <section class="map-panel" id="mapPanel" aria-label="World radio map">
    <header class="map-head">
      <div class="map-title"><strong>WORLD SIGNAL MAP</strong> · <span id="mapSubTitle">RADIO-BEARING COUNTRIES</span>
      </div>
      <button class="close-btn" id="mapClose" title="Close map">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="map-stage" id="mapStage">
      <svg class="map-svg" id="worldMapSvg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"
        aria-label="World map"></svg>
      <div class="map-empty" id="mapEmpty">Loading world signal map</div>
      <div class="map-tooltip" id="mapTooltip">
        <div class="country" id="mapTipCountry">—</div>
        <div class="station" id="mapTipStation">—</div>
        <div class="detail" id="mapTipDetail">—</div>
        <div class="controls">
          <button class="map-tip-btn" id="mapPrev">Previous</button>
          <button class="map-tip-btn" id="mapNext">Next</button>
          <button class="map-tip-btn" id="mapTune">Tune</button>
        </div>
      </div>
    </div>
  </section>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- KEYBOARD HINTS -->
  <div class="kb-hints" id="kbHints">
    <span class="h">Shortcuts</span>
    <kbd>Space</kbd> play / pause<br>
    <kbd>← →</kbd> prev / next<br>
    <kbd>↑ ↓</kbd> volume<br>
    <kbd>S</kbd> scan<br>
    <kbd>F</kbd> favorite<br>
    <kbd>T</kbd> sleep<br>
    <kbd>C</kbd> share
  </div>

  <audio id="audioEl" preload="none"></audio>

  <script>
    (function(){
  "use strict";

  // ============================================================
  // CONFIG
  // ============================================================
  const RB_MIRRORS = [
    "https://de1.api.radio-browser.info",
    "https://de2.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://at1.api.radio-browser.info",
  ];
  const PERCHANCE_BASE = "https://perchance.org/7uttf51lxd/src/data";
  const LOCAL_BASE = "src/data";
  const CACHE_KEY = "rv_cache_v3";
  const CACHE_TTL = 24 * 60 * 60 * 1000;
  const CACHE_MAX = 5000;

  const PX = 52, LO = 87.5, HI = 108;

  // ============================================================
  // STATE
  // ============================================================
  let ALL = [];
  let DIAL = [];
  let seenUrls = new Set();
  let dialIdx = -1;
  let freq = 98.8;
  let favs = new Set(), fmeta = {};
  let current = null, hls = null;
  let wantPlaying = false, playGen = 0, failCount = 0;
  let scanTimer = null, sleepTimer = null, sleepMin = 0;
  let lastVol = 0.8;
  let tuneDebounce = null;
  let superSignal = false;
  let mapOpen = false;
  let mapCountries = [];
  let mapCountryStations = new Map();
  let mapTip = { cc: null, index: 0 };
  let countryNames = {};

  try { favs = new Set(JSON.parse(localStorage.getItem("rv_favs") || "[]")); } catch(e){}
  try { fmeta = JSON.parse(localStorage.getItem("rv_fmeta") || "{}"); } catch(e){}

  const $ = id => document.getElementById(id);
  const clockTime = $("clockTime"), clockDate = $("clockDate");
  const statusPill = $("statusPill"), statusText = $("statusText");
  const fullscreenBtn = $("fullscreenBtn");
  const freqDisplay = $("freqDisplay");
  const freqWrap = $("freqWrap");
  const stationDisplay = $("stationDisplay");
  const metaText = $("metaText");
  const stationMeta = $("stationMeta");
  const dialWrap = $("dialWrap"), dialEl = $("dialEl"), ticksEl = $("ticksEl");
  const countrySel = $("countrySel");
  const playBtn = $("playBtn"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");
  const volSlider = $("volSlider");
  const scanBtn = $("scanBtn"), sleepBtn = $("sleepBtn"), favBtn = $("favBtn"), shareBtn = $("shareBtn");
  const favSheet = $("favSheet"), favList = $("favList"), favClose = $("favClose"), favCount = $("favCount");
  const sheetBackdrop = $("sheetBackdrop");
  const audioEl = $("audioEl");
  const playIcon = $("playIcon");
  const sleepLabel = $("sleepLabel");
  const toast = $("toast"), kbHints = $("kbHints");
  const superBtn = $("superBtn"), mapBtn = $("mapBtn");
  const mapBackdrop = $("mapBackdrop"), mapPanel = $("mapPanel"), mapClose = $("mapClose");
  const worldMapSvg = $("worldMapSvg"), mapEmpty = $("mapEmpty"), mapTooltip = $("mapTooltip");
  const mapTipCountry = $("mapTipCountry"), mapTipStation = $("mapTipStation"), mapTipDetail = $("mapTipDetail");
  const mapPrev = $("mapPrev"), mapNext = $("mapNext"), mapTune = $("mapTune");

  // ============================================================
  // ICONS
  // ============================================================
  const ICON_PLAY    = '<polygon points="6 3 20 12 6 21 6 3"/>';
  const ICON_PAUSE   = '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>';
  const ICON_LOADING = '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="14 42" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/></circle>';

  function setPlayIcon(name) {
    if (!playIcon) return;
    const paths = { play: ICON_PLAY, pause: ICON_PAUSE, loading: ICON_LOADING }[name] || ICON_PLAY;
    playIcon.outerHTML = '<svg viewBox="0 0 24 24" id="playIcon">' + paths + '</svg>';
  }

  // ============================================================
  // STATUS + TOAST
  // ============================================================
  function setStatus(text, kind) {
    statusText.textContent = text;
    statusPill.className = "status" + (kind ? " " + kind : "");
  }
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
  }

  // ============================================================
  // CLOCK
  // ============================================================
  function tickClock() {
    const d = new Date();
    const h = d.getHours().toString().padStart(2, "0");
    const m = d.getMinutes().toString().padStart(2, "0");
    clockTime.textContent = h + ":" + m;
    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    clockDate.textContent = days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();
  }
  tickClock();
  setInterval(tickClock, 15000);

  // ============================================================
  // HELPERS
  // ============================================================
  function buzz() { try { navigator.vibrate && navigator.vibrate(5); } catch(e){} }

  function flag(cc) {
    if (!cc || cc.length !== 2 || cc === "ZZ") return "";
    let s = "";
    for (const ch of cc.toUpperCase()) s += String.fromCodePoint(127397 + ch.charCodeAt(0));
    return s;
  }


  const SPACE_NAMES = [
    "Mars","Jupiter","Saturn","Venus","Mercury","Neptune","Uranus","Pluto",
    "Europa","Titan","Io","Ganymede","Callisto","Triton","Enceladus","Ceres",
    "Vesta","Phobos","Deimos","Charon","Eris","Haumea","Makemake","Sedna",
    "Andromeda","Orion","Sirius","Vega","Altair","Polaris","Rigel","Betelgeuse",
    "Proxima","Kepler","Voyager","Pioneer","Hubble","Apollo","Artemis","Cassini",
    "Galileo","Juno","Horizon","Genesis","Odyssey","Solstice","Zenith","Astra"
  ];
  const SPACE_BY_CC = {
    FR:"Mars", US:"Jupiter", GB:"Saturn", DE:"Venus", IT:"Mercury", ES:"Neptune",
    IE:"Europa", CA:"Titan", AU:"Uranus", NZ:"Pluto", JP:"Ganymede", CN:"Callisto",
    IN:"Triton", BR:"Enceladus", MX:"Ceres", RU:"Vesta", ZA:"Phobos", SE:"Deimos",
    NO:"Charon", DK:"Eris", FI:"Haumea", NL:"Makemake", BE:"Sedna", CH:"Andromeda",
    AT:"Orion", PT:"Sirius", GR:"Vega", PL:"Altair", CZ:"Polaris", HU:"Rigel",
    RO:"Kepler", BG:"Voyager", HR:"Pioneer", RS:"Hubble", UA:"Apollo", TR:"Artemis"
  };
  function spaceCountryName(cc) {
    if (!cc) return "Unknown Sector";
    if (SPACE_BY_CC[cc]) return SPACE_BY_CC[cc];
    let n = 0;
    for (let i = 0; i < cc.length; i++) n += cc.charCodeAt(i) * (i + 7);
    return SPACE_NAMES[n % SPACE_NAMES.length];
  }

  function normUrl(u) {
    try {
      const q = u.indexOf("?");
      if (q < 0) return u.split("#")[0].toLowerCase();
      const base = u.slice(0, q).toLowerCase();
      const qs = u.slice(q + 1).split("#")[0];
      const skip = /^(t302|uuid|ref|sabc|skey|amsparams|playerid|dist|sid|kombi|playsessionid|_art)$/i;
      const keep = qs.split("&").filter(p => p && !skip.test(p.split("=")[0]));
      keep.sort();
      return base + (keep.length ? "?" + keep.join("&") : "");
    } catch(e) { return String(u).toLowerCase(); }
  }

  function addStations(list) {
    let added = 0;
    for (const s of list) {
      if (!s || !s.u) continue;
      const key = normUrl(s.u);
      if (seenUrls.has(key)) continue;
      seenUrls.add(key);
      ALL.push(s);
      added++;
    }
    return added;
  }

  function fmtOf(s) {
    const u = (s.u || "").split("?")[0].toLowerCase();
    if (u.endsWith(".m3u8")) return "hls";
    if (u.endsWith(".pls")) return "pls";
    if (u.endsWith(".m3u")) return "m3u";
    return "stream";
  }

  function xPos(f) { return (f - LO) * PX; }

  // ============================================================
  // FREQUENCY RENDER (with digit roll)
  // ============================================================
  let lastFreqStr = "";
  function renderFreq(value) {
    const str = value.toFixed(1);
    if (str === lastFreqStr) return;
    lastFreqStr = str;
    // simple approach: keep as single span with subtle animation
    freqDisplay.textContent = str;
  }

  // ============================================================
  // DIAL
  // ============================================================
  function buildTicks() {
    ticksEl.innerHTML = "";
    ticksEl.style.width = xPos(HI) + "px";
    const frag = document.createDocumentFragment();
    for (let f = LO; f <= HI + 1e-6; f = Math.round((f + 0.1) * 10) / 10) {
      const isMaj = Math.abs(f - Math.round(f)) < 1e-6;
      const t = document.createElement("div");
      t.className = "tick" + (isMaj ? " maj" : "");
      t.style.left = xPos(f) + "px";
      t.style.height = isMaj ? "28px" : "10px";
      frag.appendChild(t);
      if (isMaj && f >= 88 && f <= 108 && Math.round(f) % 2 === 0) {
        const l = document.createElement("div");
        l.className = "tick-label";
        l.style.left = xPos(f) + "px";
        l.textContent = Math.round(f);
        frag.appendChild(l);
      }
    }
    ticksEl.appendChild(frag);
  }

  function updateStationDots() {
    ticksEl.querySelectorAll(".station-dot").forEach(el => el.remove());
    const frag = document.createDocumentFragment();
    for (const s of DIAL) {
      const d = document.createElement("div");
      d.className = "station-dot";
      d.style.left = xPos(s._fm) + "px";
      d.dataset.fm = s._fm;
      frag.appendChild(d);
    }
    ticksEl.appendChild(frag);
  }

  function highlightStationDot() {
    ticksEl.querySelectorAll(".station-dot").forEach(d => {
      const f = parseFloat(d.dataset.fm);
      d.classList.toggle("near", Math.abs(f - freq) < 0.6);
    });
  }

  function nearestIdx(f) {
    if (!DIAL.length) return -1;
    let b = 0, bd = 1e9;
    for (let i = 0; i < DIAL.length; i++) {
      const d = Math.abs(DIAL[i]._fm - f);
      if (d < bd) { bd = d; b = i; }
    }
    return b;
  }

  // ============================================================
  // PAINT
  // ============================================================
  function paint(animateFreq) {
    if (animateFreq) {
      freqDisplay.classList.remove("tuning");
      void freqDisplay.offsetWidth;
      freqDisplay.classList.add("tuning");
      clearTimeout(tuneDebounce);
      tuneDebounce = setTimeout(() => freqDisplay.classList.remove("tuning"), 250);
    }
    renderFreq(freq);

    const w = dialEl.clientWidth || window.innerWidth;
    ticksEl.style.transform = "translateX(" + (w / 2 - xPos(freq)) + "px)";

    const s = DIAL[dialIdx];
    if (s) {
      if (stationDisplay.textContent !== s.n) {
        stationDisplay.textContent = s.n;
        stationDisplay.classList.remove("swap");
        void stationDisplay.offsetWidth;
        stationDisplay.classList.add("swap");
      }
      if (stationMeta.dataset.lock !== "1") {
        const parts = [];
        if (s.cc) parts.push(superSignal ? spaceCountryName(s.cc) : (flag(s.cc) + " " + (s.l || s.cc)));
        if (s.t) parts.push(s.t.split(",").slice(0, 3).join(" · "));
        metaText.textContent = parts.filter(Boolean).join("  ·  ") || "live stream";
      }
    } else {
      stationDisplay.textContent = "—";
      metaText.textContent = DIAL.length ? "rotate the dial" : "no stations";
    }

    highlightStationDot();
  }

  function setFreq(f, snap, animate) {
    freq = Math.min(HI, Math.max(LO, f));
    if (snap && DIAL.length) dialIdx = nearestIdx(freq);
    paint(animate);
  }

  function tuneTo(i, autoplay) {
    if (!DIAL.length) return;
    stopScan();
    dialIdx = (i + DIAL.length) % DIAL.length;
    const s = DIAL[dialIdx];
    freq = s._fm;
    paint(true);
    if (autoplay) playStation(s);
  }

  // ============================================================
  // FETCH
  // ============================================================
  function fetchT(url, ms, opts) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 8000);
    return fetch(url, Object.assign({ signal: ctl.signal }, opts || {}))
      .finally(() => clearTimeout(t));
  }

  async function rb(path, timeoutMs) {
    const attempts = RB_MIRRORS.map(m =>
      fetchT(m + "/json" + path, timeoutMs || 9000).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
    );
    return Promise.any(attempts);
  }

  async function tryLoadFromBase(base, label) {
    try {
      const idx = await fetchT(base + "/index.json", 6000).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
      if (!idx || !idx.countries) throw new Error("bad index");
      const [top, gj] = await Promise.all([
        fetchT(base + "/top.json", 8000).then(r => r.ok ? r.json() : []).catch(() => []),
        fetchT(base + "/genres.json", 8000).then(r => r.ok ? r.json() : { genres: [] }).catch(() => ({ genres: [] })),
      ]);
      return { source: label, idx, top: Array.isArray(top) ? top : [], genres: gj.genres || [] };
    } catch(e) { return null; }
  }

  async function fetchFromRadioBrowser() {
    setStatus("fetching stations");
    try {
      const results = await Promise.allSettled([
        rb("/stations/topvote/1500?hidebroken=true&is_https=true"),
        rb("/stations/topclick/1500?hidebroken=true&is_https=true"),
        rb("/stations/search?limit=800&order=votes&reverse=true&hidebroken=true&is_https=true&has_geo_info=true"),
      ]);
      const raw = [];
      for (const r of results) if (r.status === "fulfilled" && Array.isArray(r.value)) raw.push(...r.value);
      if (!raw.length) throw new Error("no data");

      const stations = [];
      for (const s of raw) {
        let url = (s.url_resolved || s.url || "").trim();
        if (!url || !url.startsWith("https://")) continue;
        const codec = (s.codec || "").toUpperCase();
        const stable = codec.includes("MP3") || codec.includes("AAC") || codec.includes("MPEG");
        stations.push({
          n: (s.name || "Unknown").trim().replace(/\s+/g, " ").slice(0, 80),
          u: url,
          u2: s.url && s.url_resolved && s.url !== s.url_resolved && s.url.startsWith("https") ? s.url : null,
          cc: (s.countrycode || "ZZ").toUpperCase(),
          l: s.country || "",
          t: (s.tags || "").split(",").map(x => x.trim()).filter(Boolean).slice(0, 3).join(", "),
          https: true,
          v: (s.votes || 0) + (s.clickcount || 0) * 0.15 + (stable ? 50 : 0),
        });
      }
      stations.sort((a, b) => b.v - a.v);
      return stations;
    } catch(e) {
      console.warn("[radio] RB failed:", e.message || e);
      return null;
    }
  }

  // ============================================================
  // CACHE
  // ============================================================
  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.stations || Date.now() - d.t > CACHE_TTL) return null;
      return d.stations;
    } catch(e) { return null; }
  }
  function writeCache(stations) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        t: Date.now(),
        stations: stations.slice(0, CACHE_MAX),
      }));
    } catch(e){}
  }

  // ============================================================
  // POPULATE
  // ============================================================
  function populateFromList(stations, sourceLabel, kind) {
    if (!stations || !stations.length) return false;
    ALL = []; seenUrls = new Set();
    addStations(stations);

    const byCountry = {};
    for (const s of ALL) {
      const cc = s.cc || "ZZ";
      if (!byCountry[cc]) byCountry[cc] = { cc, c: s.l || cc, count: 0 };
      byCountry[cc].count++;
    }
    const countries = Object.values(byCountry).sort((a, b) => b.count - a.count);
    countryNames = Object.fromEntries(countries.map(c => [c.cc, c.c || c.cc]));
    if (!countries.length) return false;

    countrySel.innerHTML = "";
    const allOpt = document.createElement("option");
    allOpt.value = "__ALL__";
    allOpt.textContent = `All regions · ${ALL.length.toLocaleString()}`;
    countrySel.appendChild(allOpt);
    for (const c of countries) {
      const o = document.createElement("option");
      o.value = c.cc;
      o.textContent = superSignal ? spaceCountryName(c.cc) + " · " + c.count : ((flag(c.cc) ? flag(c.cc) + " " : "") + c.c + " · " + c.count);
      countrySel.appendChild(o);
    }
    countrySel.value = "__ALL__";
    applyPool();
    setStatus(sourceLabel, kind || "on");
    return true;
  }

  function applyPool() {
    const cc = countrySel.value;
    let pool = cc === "__ALL__" ? ALL.slice() : ALL.filter(s => (s.cc || "ZZ") === cc);
    if (!pool.length) pool = ALL.slice();

    pool.sort((a, b) => (b.v || 0) - (a.v || 0));
    DIAL = pool.slice(0, 120);

    const n = DIAL.length;
    const lo = 87.9, hi = 107.9;
    DIAL.forEach((s, i) => {
      s._fm = n === 1 ? 98.8 : Math.round((lo + (hi - lo) * i / (n - 1)) * 10) / 10;
    });
    for (let i = 1; i < DIAL.length; i++) {
      if (DIAL[i]._fm <= DIAL[i-1]._fm)
        DIAL[i]._fm = Math.min(108, Math.round((DIAL[i-1]._fm + 0.2) * 10) / 10);
    }

    buildTicks();
    updateStationDots();

    dialIdx = DIAL.length ? Math.min(DIAL.length - 1, Math.floor(DIAL.length / 2)) : -1;
    current = null;
    if (DIAL.length) {
      freq = DIAL[dialIdx]._fm;
      paint(true);
      playStation(DIAL[dialIdx]);
    } else {
      paint(false);
    }
  }

  // ============================================================
  // PLAYBACK
  // ============================================================
  function stopHls() {
    if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  }

  async function resolvePlaylist(url) {
    try {
      const r = await fetchT(url, 4000);
      const txt = await r.text();
      const m = txt.match(/File1\s*=\s*(https?:[^\s]+)/i) || txt.match(/https?:[^\s"']+/);
      if (m) return m[1].replace(/[\r\n"']+$/, "");
    } catch(e){}
    return url;
  }

  function scheduleSkip(g) {
    if (g !== playGen || !wantPlaying || failCount >= 6) return;
    failCount++;
    setTimeout(() => {
      if (g === playGen && wantPlaying && DIAL.length) tuneTo(dialIdx + 1, true);
    }, 1200);
  }

  async function tryPlayUrl(url, g, isHls) {
    return new Promise((resolve) => {
      let resolved = false;
      const done = (ok) => {
        if (resolved) return;
        resolved = true;
        audioEl.removeEventListener("playing", onPlaying);
        audioEl.removeEventListener("error", onError);
        resolve(ok);
      };
      const onPlaying = () => { if (g === playGen) done(true); };
      const onError = () => { if (g === playGen) done(false); };
      audioEl.addEventListener("playing", onPlaying, { once: true });
      audioEl.addEventListener("error", onError, { once: true });

      if (isHls && window.Hls && Hls.isSupported() && !audioEl.canPlayType("application/vnd.apple.mpegurl")) {
        try { hls && hls.destroy(); } catch(e){}
        hls = new Hls({
          maxBufferLength: 30,
          liveSyncDurationCount: 3,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2,
          fragLoadingMaxRetry: 2,
        });
        hls.loadSource(url);
        hls.attachMedia(audioEl);
        hls.on(Hls.Events.ERROR, (ev, data) => {
          if (data && data.fatal && g === playGen) done(false);
        });
      } else {
        audioEl.src = url;
      }
      const p = audioEl.play();
      if (p && p.catch) p.catch(() => done(false));
      setTimeout(() => done(false), 12000);
    });
  }

  async function playStation(s) {
    if (!s) return;
    current = s;
    const g = ++playGen;
    wantPlaying = true;

    const di = DIAL.indexOf(s);
    if (di >= 0) { dialIdx = di; freq = s._fm; }
    paint(true);
    stopHls();
    try { audioEl.pause(); } catch(e){}
    audioEl.removeAttribute("src");
    audioEl.load();

    stationDisplay.textContent = s.n;
    stationMeta.dataset.lock = "1";
    metaText.textContent = "connecting";
    setPlayIcon("loading");

    const needTap = () => {
      if (g !== playGen) return;
      metaText.textContent = "tap play to listen";
      setPlayIcon("play");
    };

    let url = s.u;
    const f = fmtOf(s);
    if (f === "pls" || f === "m3u") url = await resolvePlaylist(s.u);
    if (g !== playGen) return;

    const isHls = url.includes(".m3u8");
    const ok = await tryPlayUrl(url, g, isHls);

    if (g !== playGen) return;

    if (!ok && s.u2) {
      metaText.textContent = "trying alternate";
      const ok2 = await tryPlayUrl(s.u2, g, s.u2.includes(".m3u8"));
      if (g !== playGen) return;
      if (!ok2) {
        metaText.textContent = "seeking";
        setPlayIcon("play");
        scheduleSkip(g);
      }
    } else if (!ok) {
      metaText.textContent = "seeking";
      setPlayIcon("play");
      scheduleSkip(g);
    }
  }

  audioEl.addEventListener("playing", () => {
    failCount = 0;
    setPlayIcon("pause");
    playBtn.classList.add("playing");
    stationMeta.dataset.lock = "";
    setStatus("on air", "on");
    if (current) {
      const parts = [];
      if (current.cc) parts.push(flag(current.cc) + " " + (current.l || current.cc));
      if (current.t) parts.push(current.t.split(",").slice(0, 3).join(" · "));
      metaText.textContent = parts.filter(Boolean).join("  ·  ") || "live stream";
    }
  });

  function onStopped() {
    setPlayIcon("play");
    playBtn.classList.remove("playing");
    setStatus("standby", "");
    paint(false);
  }
  audioEl.addEventListener("pause", onStopped);
  audioEl.addEventListener("error", () => {
    if (current && audioEl.src) {
      stationMeta.dataset.lock = "1";
      metaText.textContent = "signal lost";
      scheduleSkip(playGen);
      onStopped();
    }
  });

  // ============================================================
  // CONTROLS
  // ============================================================
  playBtn.onclick = () => {
    buzz();
    if (!DIAL.length) return;
    if (!current) { tuneTo(dialIdx, true); return; }
    if (audioEl.paused) {
      wantPlaying = true;
      audioEl.play().catch(() => {
        stationMeta.dataset.lock = "1";
        metaText.textContent = "tap play to listen";
        setPlayIcon("play");
      });
    } else {
      wantPlaying = false;
      stopScan();
      audioEl.pause();
    }
  };
  prevBtn.onclick = () => { buzz(); tuneTo(dialIdx - 1, true); };
  nextBtn.onclick = () => { buzz(); tuneTo(dialIdx + 1, true); };

  // ============================================================
  // SCAN
  // ============================================================
  function stopScan() {
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    scanBtn.classList.remove("active");
    stationMeta.dataset.lock = "";
  }
  scanBtn.onclick = () => {
    buzz();
    if (scanTimer) { stopScan(); showToast("scan stopped"); return; }
    if (!DIAL.length) return;
    scanBtn.classList.add("active");
    stationMeta.dataset.lock = "1";
    metaText.textContent = "scanning";
    showToast("scanning");
    scanTimer = setInterval(() => tuneTo(dialIdx + 1, true), 8000);
  };

  // ============================================================
  // SLEEP
  // ============================================================
  const SLEEP_STEPS = [0, 15, 30, 45, 60, 90];
  sleepBtn.onclick = () => {
    buzz();
    const i = (SLEEP_STEPS.indexOf(sleepMin) + 1) % SLEEP_STEPS.length;
    sleepMin = SLEEP_STEPS[i];
    if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
    if (!sleepMin) {
      sleepBtn.classList.remove("active");
      playBtn.classList.remove("sleeping");
      sleepLabel.textContent = "Sleep";
      showToast("sleep off");
    } else {
      sleepBtn.classList.add("active");
      playBtn.classList.add("sleeping");
      sleepLabel.textContent = sleepMin + "m";
      showToast(sleepMin + " minute timer");
      sleepTimer = setTimeout(() => {
        wantPlaying = false;
        stopScan();
        try { audioEl.pause(); } catch(e){}
        sleepMin = 0;
        sleepBtn.classList.remove("active");
        playBtn.classList.remove("sleeping");
        sleepLabel.textContent = "Sleep";
        stationMeta.dataset.lock = "1";
        metaText.textContent = "sleep timer off";
      }, sleepMin * 60000);
    }
  };

  // ============================================================
  // SHARE
  // ============================================================
  shareBtn.onclick = async () => {
    buzz();
    const s = current || DIAL[dialIdx];
    if (!s) return;
    const txt = s.n + " — " + s.u;
    try {
      if (navigator.share) { await navigator.share({ title: s.n, text: s.n + " · live radio", url: s.u }); return; }
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(txt);
        showToast("link copied");
        return;
      }
      throw 0;
    } catch(e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = txt; ta.style.cssText = "position:fixed;opacity:0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
        showToast("link copied");
      } catch(e2) { showToast("copy failed"); }
    }
  };

  // ============================================================
  // FAVORITES
  // ============================================================
  function toggleFav(s) {
    if (favs.has(s.u)) { favs.delete(s.u); delete fmeta[s.u]; showToast("removed"); }
    else { favs.add(s.u); fmeta[s.u] = s; showToast("saved"); }
    try {
      localStorage.setItem("rv_favs", JSON.stringify([...favs]));
      localStorage.setItem("rv_fmeta", JSON.stringify(fmeta));
    } catch(e){}
    paint(false);
  }

  function renderFavs() {
    favList.innerHTML = "";
    const arr = Object.values(fmeta);
    favCount.textContent = arr.length;
    if (!arr.length) {
      const e = document.createElement("div");
      e.className = "empty-msg";
      e.textContent = "No saved stations yet";
      favList.appendChild(e);
      return;
    }
    const frag = document.createDocumentFragment();
    for (const s of arr) {
      const d = document.createElement("div");
      d.className = "fav-item";
      const info = document.createElement("div");
      info.className = "info";
      const nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = s.n;
      const det = document.createElement("div");
      det.className = "detail";
      det.textContent = [flag(s.cc), s.l, s.t].filter(Boolean).join("  ·  ") || "live";
      info.appendChild(nm); info.appendChild(det);
      const rm = document.createElement("button");
      rm.className = "remove";
      rm.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      rm.onclick = ev => { ev.stopPropagation(); toggleFav(s); renderFavs(); };
      d.appendChild(info); d.appendChild(rm);
      d.onclick = () => { closeSheet(); playStation(s); };
      frag.appendChild(d);
    }
    favList.appendChild(frag);
  }

  function openSheet() {
    renderFavs();
    favSheet.classList.add("open");
    sheetBackdrop.classList.add("open");
  }
  function closeSheet() {
    favSheet.classList.remove("open");
    sheetBackdrop.classList.remove("open");
  }

  favBtn.onclick = () => { buzz(); openSheet(); };
  favClose.onclick = () => { buzz(); closeSheet(); };
  sheetBackdrop.onclick = () => closeSheet();

  // ============================================================
  // VOLUME
  // ============================================================
  function setVol(v) {
    lastVol = Math.min(1, Math.max(0, v));
    audioEl.volume = lastVol;
    const pct = Math.round(lastVol * 100);
    volSlider.value = pct;
    volSlider.style.background = `linear-gradient(90deg, var(--accent) ${pct}%, var(--line) ${pct}%)`;
  }
  volSlider.addEventListener("input", () => setVol(volSlider.value / 100));

  // ============================================================
  // DIAL DRAG
  // ============================================================
  (function(){
    let down = false, sx = 0, sf = 0, moved = false, raf = null;
    dialWrap.addEventListener("pointerdown", e => {
      down = true; moved = false; sx = e.clientX; sf = freq;
      try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch(err){}
    });
    window.addEventListener("pointermove", e => {
      if (!down) return;
      const dx = e.clientX - sx;
      if (Math.abs(dx) > 3) moved = true;
      const nf = sf - dx / PX;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        setFreq(nf, false, false);
        dialIdx = nearestIdx(freq);
        paint(false);
      });
    });
    window.addEventListener("pointerup", () => {
      if (!down) return;
      down = false;
      if (moved && DIAL.length) tuneTo(nearestIdx(freq), true);
    });
  })();

  // Double-click frequency = random station
  freqWrap.addEventListener("dblclick", () => {
    if (!DIAL.length) return;
    buzz();
    const ri = Math.floor(Math.random() * DIAL.length);
    tuneTo(ri, true);
    showToast("random");
  });


  // ============================================================
  // SUPER SIGNAL (VISUAL ONLY)
  // ============================================================
  function refreshCountryLabels() {
    for (const o of countrySel.options) {
      if (o.value === "__ALL__") continue;
      const cc = o.value;
      const match = ALL.find(s => (s.cc || "ZZ") === cc);
      const name = countryNames[cc] || (match ? (match.l || cc) : cc);
      o.textContent = superSignal ? spaceCountryName(cc) : ((flag(cc) ? flag(cc) + " " : "") + name);
    }
    mapRender();
  }

  function setSuperSignal(on) {
    superSignal = !!on;
    document.body.classList.toggle("super-signal", superSignal);
    superBtn.classList.toggle("active", superSignal);
    superBtn.setAttribute("aria-pressed", String(superSignal));
    $("mapSubTitle").textContent = superSignal ? "DEEP SPACE SIGNAL GRID" : "RADIO-BEARING COUNTRIES";
    refreshCountryLabels();
    paint(false);
    showToast(superSignal ? "super signal · visual mode" : "standard visual mode");
  }

  // ============================================================
  // WORLD MAP
  // ============================================================
  function projectPoint(lon, lat) {
    const x = (lon + 180) / 360 * 1000;
    const y = (90 - lat) / 180 * 520;
    return [x, y];
  }

  function stationsByCountry() {
    const m = new Map();
    for (const st of ALL) {
      const cc = (st.cc || "ZZ").toUpperCase();
      if (!m.has(cc)) m.set(cc, []);
      m.get(cc).push(st);
    }
    return m;
  }

  async function mapRender() {
    if (!mapOpen) return;
    mapCountryStations = stationsByCountry();
    mapEmpty.textContent = "Loading world signal map";
    mapEmpty.style.display = "grid";
    worldMapSvg.innerHTML = "";
    try {
      if (!window.d3) throw new Error("map renderer unavailable");
      const [land, countries] = await Promise.all([
        fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json").then(r => r.json()),
        fetch("https://cdn.jsdelivr.net/npm/world-countries@5.0.0/countries.json").then(r => r.json())
      ]);
      const projection = d3.geoNaturalEarth1().fitSize([1000,520], {type:"Sphere"});
      const path = d3.geoPath(projection);
      const svg = d3.select(worldMapSvg);
      svg.append("path").datum({type:"Sphere"}).attr("class","map-graticule").attr("d",path);
      const landFeature = topojson.feature(land, land.objects.land);
      svg.append("path").datum(landFeature).attr("class","map-land").attr("d",path);
      const graticule = d3.geoGraticule10();
      svg.append("path").datum(graticule).attr("class","map-graticule").attr("d",path);

      let visible = 0;
      for (const c of countries) {
        const cc = (c.cca2 || "").toUpperCase();
        const stations = mapCountryStations.get(cc);
        if (!stations || !stations.length || !c.latlng || c.latlng.length < 2) continue;
        const [lat, lon] = c.latlng;
        const p = projection([lon, lat]);
        if (!p) continue;
        visible++;
        const g = svg.append("g").attr("class","country-marker");
        g.append("circle")
          .attr("class","country-node")
          .attr("cx",p[0]).attr("cy",p[1]).attr("r",3.4)
          .attr("data-cc",cc)
          .on("click", () => openMapCountry(cc));
        if (stations.length <= 2) {
          g.append("text").attr("class","map-label").attr("x",p[0]+7).attr("y",p[1]+3)
            .text(superSignal ? spaceCountryName(cc) : cc);
        }
      }
      mapEmpty.style.display = visible ? "none" : "grid";
      if (!visible) mapEmpty.textContent = "No radio-bearing countries available";
    } catch (e) {
      mapEmpty.style.display = "grid";
      mapEmpty.textContent = "World map data unavailable";
    }
  }

  function openMapCountry(cc) {
    const stations = mapCountryStations.get(cc) || [];
    if (!stations.length) return;
    mapTip.cc = cc;
    mapTip.index = 0;
    document.querySelectorAll(".country-node.active").forEach(n => n.classList.remove("active"));
    const node = document.querySelector('.country-node[data-cc="' + cc + '"]');
    if (node) node.classList.add("active");
    renderMapTip();
  }

  function renderMapTip() {
    const stations = mapCountryStations.get(mapTip.cc) || [];
    if (!stations.length) return;
    const st = stations[mapTip.index % stations.length];
    const country = ALL.find(x => (x.cc || "ZZ") === mapTip.cc);
    mapTipCountry.textContent = superSignal ? spaceCountryName(mapTip.cc) : ((flag(mapTip.cc) || "") + " " + (country?.l || mapTip.cc));
    mapTipStation.textContent = st.n || "Unknown station";
    mapTipDetail.textContent = (st.t || "live stream") + " · " + (mapTip.index + 1) + " / " + stations.length;
    mapTooltip.classList.add("show");
  }

  function closeMap() {
    mapOpen = false;
    mapPanel.classList.remove("open");
    mapBackdrop.classList.remove("open");
    mapBtn.classList.remove("active");
    mapTooltip.classList.remove("show");
  }

  mapBtn.onclick = () => {
    buzz();
    mapOpen = true;
    mapPanel.classList.add("open");
    mapBackdrop.classList.add("open");
    mapBtn.classList.add("active");
    mapRender();
  };
  mapClose.onclick = closeMap;
  mapBackdrop.onclick = closeMap;
  superBtn.onclick = () => { buzz(); setSuperSignal(!superSignal); };
  mapPrev.onclick = () => {
    const stations = mapCountryStations.get(mapTip.cc) || [];
    if (!stations.length) return;
    mapTip.index = (mapTip.index - 1 + stations.length) % stations.length;
    renderMapTip();
  };
  mapNext.onclick = () => {
    const stations = mapCountryStations.get(mapTip.cc) || [];
    if (!stations.length) return;
    mapTip.index = (mapTip.index + 1) % stations.length;
    renderMapTip();
  };
  mapTune.onclick = () => {
    const stations = mapCountryStations.get(mapTip.cc) || [];
    if (!stations.length) return;
    const target = stations[mapTip.index % stations.length];
    const idx = DIAL.indexOf(target);
    if (idx >= 0) tuneTo(idx, true);
    else {
      countrySel.value = mapTip.cc;
      applyPool();
    }
    closeMap();
  };

  // ============================================================
  // COUNTRY
  // ============================================================
  countrySel.addEventListener("change", () => { buzz(); applyPool(); });

  // ============================================================
  // FULLSCREEN
  // ============================================================
  fullscreenBtn.onclick = () => {
    buzz();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  };

  // ============================================================
  // KEYBOARD
  // ============================================================
  let hintsTimer = null;
  function flashHints() {
    kbHints.classList.add("show");
    clearTimeout(hintsTimer);
    hintsTimer = setTimeout(() => kbHints.classList.remove("show"), 2600);
  }

  document.addEventListener("keydown", e => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;

    switch (e.key) {
      case " ":
      case "k":
        e.preventDefault();
        playBtn.click();
        flashHints();
        break;
      case "ArrowLeft":
        e.preventDefault();
        prevBtn.click();
        flashHints();
        break;
      case "ArrowRight":
        e.preventDefault();
        nextBtn.click();
        flashHints();
        break;
      case "ArrowUp":
        e.preventDefault();
        setVol(lastVol + 0.05);
        flashHints();
        break;
      case "ArrowDown":
        e.preventDefault();
        setVol(lastVol - 0.05);
        flashHints();
        break;
      case "s":
      case "S":
        scanBtn.click();
        flashHints();
        break;
      case "f":
      case "F":
        if (current) toggleFav(current);
        else favBtn.click();
        flashHints();
        break;
      case "t":
      case "T":
        sleepBtn.click();
        flashHints();
        break;
      case "c":
      case "C":
        shareBtn.click();
        flashHints();
        break;
      case "m":
      case "M":
        mapBtn.click();
        flashHints();
        break;
      case "x":
      case "X":
        superBtn.click();
        flashHints();
        break;
      case "Escape":
